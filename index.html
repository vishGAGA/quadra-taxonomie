  }catch(e){ body.innerHTML='<div class="hint">eroare: '+esc(e.message)+'</div>'; }
}

// ================= GESTIUNE STRUCTURA (adauga/sterge leafuri, colapseaza capitol) =================
async function structRefreshArbore(){
  // reincarca lazy copiii in arbore (daca nodul e expandat) - altfel se reincarca la re-expandare
  try{ document.querySelectorAll('#tree-root .children.open').forEach(k=>{ k.dataset.loaded=''; }); }catch(e){}
}
// Reincarca in loc subarborele unui nod, ca sa se vada imediat ce s-a creat/sters,
// fara sa pierzi pozitia din arbore.
async function structReincarcaSub(nodId){
  const wrap = document.querySelector(`#tree-root .node[data-id="${CSS.escape(nodId)}"]`);
  if(!wrap) return structRefreshArbore();
  const kids = wrap.querySelector(':scope > .children'); if(!kids) return;
  const caret = wrap.querySelector(':scope > .node-row .caret');
  if(caret){ caret.classList.remove('empty'); caret.classList.add('open'); }
  kids.classList.add('open'); kids.dataset.loaded='';
  kids.innerHTML = '<div class="loading">se incarca...</div>';
  await loadChildren(nodId, kids);
}

// Adauga sub nodul curent. In arbore nu exista "tip" ales de om: un nod e leaf cat timp
// nu are copii si devine capitol in clipa in care primeste primul copil. De aceea varianta
// "capitol" cere de la inceput si numele primului leaf din el — altfel ar ramane un capitol
// gol, care nu se mai poate nici sterge (nu e leaf), nici colapsa (n-are copii).
async function modalAdaugaNod(n){
  const o = showModal(`Adauga sub &laquo;${esc(n.denumire)}&raquo;`, `
      <div class="hint" style="margin-bottom:10px"><span class="node-id">${esc(n.nod_id)}</span> &middot; ${esc(n.tip)}</div>
      <label class="lbl">Ce adaugi</label>
      <div class="editbar" style="margin:0 0 12px">
        <label style="display:flex;gap:7px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--border);border-radius:8px;flex:1">
          <input type="radio" name="an-tip" value="leaf" checked style="margin-top:3px">
          <span><b>Leaf</b><div class="hint" style="margin:2px 0 0">Pozitie de deviz. Primeste P-uri si parametri.</div></span>
        </label>
        <label style="display:flex;gap:7px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--border);border-radius:8px;flex:1">
          <input type="radio" name="an-tip" value="capitol" style="margin-top:3px">
          <span><b>Capitol</b><div class="hint" style="margin:2px 0 0">Grupeaza alte noduri. Cere si primul leaf din el.</div></span>
        </label>
      </div>
      <label class="lbl">Denumire</label>
      <input id="an-den" placeholder="ex. Tencuiala de var" autocomplete="off">
      <div id="an-copil-box" style="display:none;margin-top:12px">
        <label class="lbl">Primul leaf din capitol</label>
        <input id="an-copil" placeholder="ex. Var pasta aplicat manual" autocomplete="off">
        <div class="hint">Un capitol fara copii ramane blocat: nu se poate sterge si nu se poate colapsa.</div>
      </div>
      ${n.tip==='leaf' ? '<div class="hint" style="margin-top:12px;color:var(--accent)">Atentie: acest nod e acum leaf. Daca primeste un copil devine capitol, iar P-urile lui raman pe el fara sa mai fie vizibile ca pozitie de deviz.</div>' : ''}
    `, `<button class="btn" id="an-x">Renunta</button><button class="btn primary" id="an-ok">Creeaza</button>`);
  const den=o.querySelector('#an-den'), cop=o.querySelector('#an-copil'), box=o.querySelector('#an-copil-box');
  o.querySelectorAll('input[name="an-tip"]').forEach(r=> r.onchange=()=>{
    box.style.display = o.querySelector('input[name="an-tip"]:checked').value==='capitol' ? '' : 'none';
  });
  den.focus();
  o.querySelector('#an-x').onclick = closeModal;
  o.querySelector('#an-ok').onclick = async (ev)=>{
    const tip = o.querySelector('input[name="an-tip"]:checked').value;
    const d = den.value.trim(), c = cop.value.trim();
    if(d.length<2){ toast('Denumire prea scurta.', true); return; }
    if(tip==='capitol' && c.length<2){ toast('Capitolul are nevoie si de primul leaf din el.', true); return; }
    closeModal();
    const det = [`sub <span class="node-id">${esc(n.nod_id)}</span> &laquo;${esc(n.denumire)}&raquo;`];
    if(tip==='capitol') det.push(`capitolul primeste imediat leaf-ul &laquo;${esc(c)}&raquo;`);
    if(n.tip==='leaf') det.push('<b>nodul parinte devine capitol</b> si nu mai e pozitie de deviz');
    if(!await confirmaDubla({
      titlu:'Confirmi crearea?',
      rezumat:`Se creeaza ${tip==='capitol'?'un <b>capitol</b>':'un <b>leaf</b>'} numit &laquo;<b>${esc(d)}</b>&raquo;.`,
      detalii:det, textOk:'Da, creeaza'})) return;
    ev = {target:{disabled:false}};   // modalul de creare s-a inchis; nu mai exista butonul original
    try{
      const idn = await rpc('edit_creeaza_leaf', { _parinte:n.nod_id, _denumire:d });
      let mesaj = 'Creat: '+idn;
      if(tip==='capitol'){
        const idc = await rpc('edit_creeaza_leaf', { _parinte:idn, _denumire:c });
        mesaj = 'Capitol '+idn+' cu leaf-ul '+idc;
      }
      closeModal(); toast(mesaj);
      delete nodeCache[n.nod_id];              // parintele poate fi promovat leaf -> capitol
      await structReincarcaSub(n.nod_id);
      showDetail(idn);
    }catch(err){ toast(err.message, true); ev.target.disabled=false; }
  };
}

// ---- Stergerea unui capitol, cu tot ce are sub el ----
// Baza nu are o functie de stergere recursiva, dar are piesele din care se compune una:
//   edit_sterge_leafuri (in lot) + edit_creeaza_leaf + edit_colapseaza_capitol.
// Un capitol golit ramane tip='familie': nu se poate sterge (nu e leaf) si nu se poate
// colapsa (n-are copii). Il deblocam punand un copil temporar, colapsand si stergand.
function bucati(v, n){ const o=[]; for(let i=0;i<v.length;i+=n) o.push(v.slice(i,i+n)); return o; }

// Subarborele, nivel cu nivel, mergand dupa parinte_id (nu dupa forma id-ului).
// niveluri[0] = copiii directi; ultimul = cel mai adanc.
async function subarboreNiveluri(nodId){
  const niveluri = []; let curent = [nodId];
  for(let d=0; d<25 && curent.length; d++){
    let copii = [];
    for(const lot of bucati(curent, 60)){
      const lista = lot.map(x=>`"${x}"`).join(',');
      copii = copii.concat(await q(`/viz_noduri?parinte_id=in.${encodeURIComponent('('+lista+')')}&select=nod_id,parinte_id,tip,denumire`));
    }
    if(!copii.length) break;
    niveluri.push(copii);
    curent = copii.filter(c=>c.tip!=='leaf').map(c=>c.nod_id);
  }
  return niveluri;
}
async function stergeCapitolGol(id){
  await rpc('edit_creeaza_leaf',      { _parinte:id, _denumire:'temporar pentru stergere' });
  await rpc('edit_colapseaza_capitol',{ _capitol:id });
  await rpc('edit_sterge_leafuri',    { _leafuri:[id] });
}
async function structStergeNod(n){
  if(n.tip==='leaf') return modalStergeLeaf(n);
  let niveluri = [];
  try{ niveluri = await subarboreNiveluri(n.nod_id); }
  catch(e){ toast(e.message, true); return; }
  const toti     = niveluri.flat();
  const leafuri  = toti.filter(x=>x.tip==='leaf');
  const capitole = toti.filter(x=>x.tip!=='leaf');
  // cate operatii: leafurile pleaca in loturi, fiecare capitol cere 3 apeluri
  const nrOp = bucati(leafuri.map(x=>x.nod_id), 50).length + (capitole.length + 1) * 3;

  const detalii = toti.length
    ? [`<b>${leafuri.length}</b> leafuri si <b>${capitole.length}</b> subcapitole se sterg odata cu el`,
       'P-urile raman in dictionar; se pierd doar legaturile lor cu leafurile sterse',
       'stergerea merge de jos in sus, in ' + nrOp + ' pasi — nu inchide pagina pana la mesajul final',
       'se poate reveni cu <b>&#8617; Reverse</b>, dar undo-ul acopera ultimele operatii, nu tot lantul']
    : ['nodul nu mai are copii, dar e inca marcat drept capitol, deci nu se poate sterge direct',
       'il transform intai in leaf (copil temporar + colapsare) si abia apoi il sterg',
       'se poate reveni imediat cu <b>&#8617; Reverse</b>'];

  if(!await confirmaDubla({
    titlu: toti.length ? 'Confirmi stergerea capitolului CU TOT CE ARE SUB EL?' : 'Confirmi stergerea capitolului gol?',
    rezumat:`Se sterge <span class="node-id">${esc(n.nod_id)}</span> &laquo;<b>${esc(n.denumire)}</b>&raquo;`
      + (toti.length ? ` si <b>${toti.length}</b> noduri de sub el.` : '.'),
    detalii, textOk: toti.length ? 'Da, sterge tot' : 'Da, sterge capitolul', cuvant:'STERG'})) return;

  let facut = 0;
  const pas = ()=> toast(`Sterg... ${++facut}/${nrOp}`);
  try{
    // de jos in sus: intai leafurile nivelului, apoi capitolele lui (deja golite)
    for(let i=niveluri.length-1; i>=0; i--){
      const lf = niveluri[i].filter(x=>x.tip==='leaf').map(x=>x.nod_id);
      for(const lot of bucati(lf, 50)){ await rpc('edit_sterge_leafuri',{_leafuri:lot}); pas(); }
      for(const c of niveluri[i].filter(x=>x.tip!=='leaf')){ await stergeCapitolGol(c.nod_id); facut+=3; }
    }
    await stergeCapitolGol(n.nod_id);
    toast(`Sters: ${esc(n.denumire)}${toti.length?` si ${toti.length} noduri de sub el`:''}.`);
    toti.forEach(x=> delete nodeCache[x.nod_id]);
    delete nodeCache[n.nod_id];
    if(n.parinte_id){ delete nodeCache[n.parinte_id]; await structReincarcaSub(n.parinte_id); showDetail(n.parinte_id); }
    else await structRefreshArbore();
  }catch(err){
    toast('Stergere oprita dupa '+facut+' pasi: '+err.message+' — restul subarborelui a ramas pe loc.', true);
    await structRefreshArbore();
  }
}

async function structColapsaza(nodId, denum){
  if(!confirm(`Colapsez capitolul "${denum}" intr-un singur leaf?\nTOATE leafurile-copil se sterg, iar P-urile lor urca pe acest capitol (care devine leaf). Ireversibil.`)) return;
  try{ const r = await rpc('edit_colapseaza_capitol', { _capitol:nodId });
    toast(r); await structRefreshArbore();
    delete nodeCache[nodId]; // tip-ul nodului tocmai s-a schimbat familie->leaf, cache-ul vechi ar arata stare gresita
    showDetail(nodId);
  }catch(err){ toast(err.message, true); }
}
async function undoLista(){
  try{ const l = await rpc('edit_undo_list', {}); return Array.isArray(l)?l:[]; }catch(e){ return []; }
}
async function structReverse(){
  const lst = await undoLista();
  if(!lst.length){ toast('Nimic de anulat.'); return; }
  const u = lst[0];
  if(!confirm(`Anulez ultima modificare de structura?\n\n"${u.descriere||'ultima operatie'}"\n\nDisponibile pentru anulare: ${lst.length} (se pot anula pana la 3 la rand). Se readuc nodurile, P-urile si parametrii exact ca inainte.`)) return;
  try{
    const r = await rpc('edit_undo', {});
    toast(r); await structRefreshArbore();
    try{
      if(currentId){
        const still = await q(`/viz_noduri?nod_id=eq.${encodeURIComponent(currentId)}&select=nod_id`);
        delete nodeCache[currentId]; // undo poate schimba orice camp (inclusiv tip) pe nodul curent — nu randa din cache vechi
        if(still.length) showDetail(currentId); else setMode('tree');
      }
    }catch(e){ setMode('tree'); }
  }catch(err){ toast(err.message, true); }
}
async function modalStergeLeaf(n){
  // date: parintele (capitolul superior), fratii, P-urile leafului
  let puri=[], copii=[], parinte=null;
  try{
    puri = await q(`/viz_leaf_p?leaf_id=eq.${encodeURIComponent(n.nod_id)}&select=p_id,denumire&order=pozitie`);
    if(n.parinte_id){
      parinte = (await q(`/viz_noduri?nod_id=eq.${encodeURIComponent(n.parinte_id)}&select=nod_id,denumire,tip`))[0]||null;
      copii = await q(`/viz_noduri?parinte_id=eq.${encodeURIComponent(n.parinte_id)}&select=nod_id,denumire,tip&order=nod_id`);
    }
  }catch(e){ toast('Nu am putut incarca datele: '+e.message, true); return; }
  const frati = copii.filter(c=>c.tip==='leaf' && c.nod_id!==n.nod_id);
  const totLeafuri = copii.filter(c=>c.tip==='leaf');           // toate leafurile capitolului (incl. n)
  const capitolDoarLeafuri = copii.length>0 && copii.every(c=>c.tip==='leaf');
  const capId = parinte? parinte.nod_id : null;
  const capDen = parinte? parinte.denumire : '(fara capitol)';
  const numeTinta = id => id===capId ? ('capitolul „'+capDen+'”') : (frati.find(f=>f.nod_id===id)?.denumire || id);

  // --- rand per P: tinte = capitolul superior + leafurile-frati (bifare multipla) ---
  const optTinta = (p,val,label,accent) => `<label style="display:inline-flex;gap:5px;align-items:center;margin:2px 10px 2px 0;font-size:12px;${accent?'font-weight:600;color:var(--accent)':''}"><input type="checkbox" class="mv" data-p="${esc(p.p_id)}" value="${esc(val)}"> ${label}</label>`;
  const randP = p => `<div class="pcard" data-p="${esc(p.p_id)}" style="border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:6px">
      <div style="font-size:12.5px;margin-bottom:5px"><span class="p-id">${esc(p.p_id)}</span> <b>${esc(p.denumire)}</b> <span class="pstat" style="float:right;font-size:11px"></span></div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:3px">unde se muta (poti alege mai multe):</div>
      ${capId?optTinta(p,capId,'&#11014; '+esc(capDen)+' (capitol superior)',true):''}

    </div>`;

  const paneLeaf = `
    <div class="hint">Se sterge <b>doar</b> leaful <b>${esc(n.denumire)}</b>. Pentru fiecare articol (P) de mai jos alege unde se muta; ce ramane nebifat <b style="color:#f87171">se pierde</b>.</div>
    ${puri.length ? `<div style="margin:4px 0 6px;display:flex;gap:6px;flex-wrap:wrap">
        ${capId?`<button class="btn mini" id="mv-cap">muta tot pe capitol</button>`:''}
        ${frati.length?`<button class="btn mini" id="mv-frate1">muta tot pe „${esc(frati[0].denumire)}”</button>`:''}
        <button class="btn mini" id="mv-clear">nu muta nimic</button>
      </div>
      <div style="max-height:240px;overflow-y:auto">${puri.map(randP).join('')}</div>`
      : `<div class="hint">Leaful nu are articole (P) — se sterge simplu.</div>`}`;

  const paneCap = capId ? `
    <div class="hint">Se sterg <b>TOATE cele ${totLeafuri.length} leafuri</b> din capitolul <b>${esc(capDen)}</b>${frati.length?` (inclusiv „${esc(n.denumire)}” si: ${frati.map(f=>'„'+esc(f.denumire)+'”').join(', ')})`:''}.</div>
    <div style="border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;line-height:1.6">
      &#11014; <b>Toate articolele (P) ale acestor leafuri urca pe capitolul „${esc(capDen)}”</b>, care devine el insusi leaf. Nu se pierde niciun P.
    </div>
    ${!capitolDoarLeafuri ? `<div class="hint" style="color:#f87171;margin-top:8px">&#9888; Indisponibil: capitolul „${esc(capDen)}” contine si sub-categorii, nu doar leafuri. Sterge/muta intai sub-categoriile, sau foloseste scenariul de sus pentru cate un leaf.</div>` : ''}`
    : `<div class="hint">Acest leaf nu are un capitol superior.</div>`;

  const body = `
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px;font-size:12.5px;line-height:1.7">
      Leaf: <b>${esc(n.denumire)}</b> <span class="p-id">${esc(n.nod_id)}</span><br>
      Capitol superior: <b>${esc(capDen)}</b>${capId?` <span class="p-id">${esc(capId)}</span>`:''} &middot; articole (P) pe acest leaf: <b>${puri.length}</b>
    </div>
    <label style="display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:600;margin:2px 0"><input type="radio" name="delmode" value="leaf" checked style="margin-top:3px"> &#128465; Sterg DOAR acest leaf</label>
    <div id="pane-leaf" style="margin:4px 0 12px 22px">${paneLeaf}</div>
    <label style="display:flex;gap:8px;align-items:flex-start;font-size:13.5px;font-weight:600;margin:2px 0;${(!capId||!capitolDoarLeafuri)?'opacity:.55':''}"><input type="radio" name="delmode" value="capitol" ${(!capId||!capitolDoarLeafuri)?'disabled':''} style="margin-top:3px"> &#128193; Sterg TOATE leafurile capitolului „${esc(capDen)}”</label>
    <div id="pane-capitol" style="margin:4px 0 4px 22px;display:none">${paneCap}</div>`;

  const foot = `<button class="btn" id="sl-cancel">renunta</button>
    <button class="btn" id="sl-back" style="display:none">&#8592; inapoi</button>
    <button class="btn primary" id="sl-next">continua &#8594;</button>
    <button class="btn danger primary" id="sl-ok" style="display:none">DA, sterge definitiv</button>`;
  const m = showModal('&#128465; Stergere structura', body, foot);
  const $=s=>m.querySelector(s), paneL=$('#pane-leaf'), paneC=$('#pane-capitol');
  const bNext=$('#sl-next'), bBack=$('#sl-back'), bOk=$('#sl-ok');

  function modul(){ return (m.querySelector('input[name=delmode]:checked')||{}).value||'leaf'; }
  function refreshStare(){
    // pentru modul "leaf": marcheaza fiecare P ca mutat / se pierde
    puri.forEach(p=>{
      const card=m.querySelector(`.pcard[data-p="${CSS.escape(p.p_id)}"]`); if(!card) return;
      const chk=card.querySelectorAll('input.mv:checked').length;
      const st=card.querySelector('.pstat');
      if(chk){ st.textContent='se muta'; st.style.color='var(--green)'; card.style.borderColor='var(--border)'; }
      else { st.textContent='SE PIERDE'; st.style.color='#f87171'; card.style.borderColor='#f8717155'; }
    });
  }
  m.querySelectorAll('input[name=delmode]').forEach(r=> r.onchange=()=>{
    const md=modul(); paneL.style.display = md==='leaf'?'':'none'; paneC.style.display = md==='capitol'?'':'none';
  });
  paneL.addEventListener('change', e=>{ if(e.target.classList.contains('mv')) refreshStare(); });
  if($('#mv-cap')) $('#mv-cap').onclick=()=>{ m.querySelectorAll('.pcard').forEach(c=>{ c.querySelectorAll('input.mv').forEach(x=> x.checked = x.value===capId); }); refreshStare(); };
  if($('#mv-frate1')) $('#mv-frate1').onclick=()=>{ const f=frati[0].nod_id; m.querySelectorAll('.pcard').forEach(c=>{ c.querySelectorAll('input.mv').forEach(x=> x.checked = x.value===f); }); refreshStare(); };
  if($('#mv-clear')) $('#mv-clear').onclick=()=>{ m.querySelectorAll('input.mv').forEach(x=> x.checked=false); refreshStare(); };
  refreshStare();

  $('#sl-cancel').onclick=closeModal;

  // ---- pasul 2: rezumat + a doua confirmare ----
  let plan=null;
  function construiestePlan(){
    const md=modul();
    if(md==='capitol'){
      return { mod:'capitol', rez:`
        <div style="font-size:13px;line-height:1.7">
          Se <b style="color:#f87171">STERG ${totLeafuri.length} leafuri</b> din capitolul <b>${esc(capDen)}</b>.<br>
          &#11014; Toate articolele lor urca pe <b>„${esc(capDen)}”</b>, care devine leaf. Niciun P nu se pierde.
        </div>` };
    }
    const asign={}; m.querySelectorAll('input.mv:checked').forEach(c=>{ (asign[c.dataset.p]=asign[c.dataset.p]||[]).push(c.value); });
    const _assignari = Object.keys(asign).map(p=>({p_id:p, targets:asign[p]}));
    const lines = puri.map(p=>{
      const t=asign[p.p_id];
      return t && t.length
        ? `<div>&#8226; <b>${esc(p.denumire)}</b> &#8594; ${t.map(numeTinta).map(esc).join(', ')}</div>`
        : `<div style="color:#f87171">&#8226; <b>${esc(p.denumire)}</b> &#8594; SE PIERDE</div>`;
    }).join('');
    const npierd = puri.filter(p=>!asign[p.p_id]).length;
    return { mod:'leaf', _assignari, rez:`
      <div style="font-size:13px;line-height:1.7">
        Se <b style="color:#f87171">STERGE</b> leaful <b>${esc(n.denumire)}</b>.
        ${puri.length?`<div style="margin-top:6px;max-height:180px;overflow:auto">${lines}</div>
        <div style="margin-top:6px">${npierd?`<b style="color:#f87171">${npierd} articol(e) se pierd definitiv.</b>`:'Toate articolele se muta — nu se pierde nimic.'}</div>`:'Leaful nu are articole.'}
      </div>` };
  }
  bNext.onclick=()=>{
    if(modul()==='capitol' && (!capId || !capitolDoarLeafuri)) return;
    plan=construiestePlan();
    paneL.style.display='none'; paneC.style.display='none';
    m.querySelectorAll('input[name=delmode]').forEach(r=> r.closest('label').style.display='none');
    // banner de confirmare
    let cb=$('#sl-confirm'); if(!cb){ cb=document.createElement('div'); cb.id='sl-confirm'; (paneC.parentNode).appendChild(cb); }
    cb.innerHTML = `<div style="border:1px solid #f8717155;background:#f871710d;border-radius:8px;padding:10px 12px">
        <div style="font-weight:700;margin-bottom:6px">&#9888; Confirma stergerea</div>
        ${plan.rez}
        <div class="hint" style="margin:8px 0 0">Poti reveni imediat dupa cu butonul <b>&#8617; Reverse</b> din Gestiune structura.</div>
      </div>`;
    cb.style.display='';
    bNext.style.display='none'; bBack.style.display=''; bOk.style.display='';
  };
  bBack.onclick=()=>{
    const cb=$('#sl-confirm'); if(cb) cb.style.display='none';
    m.querySelectorAll('input[name=delmode]').forEach(r=> r.closest('label').style.display='');
    paneL.style.display = modul()==='leaf'?'':'none'; paneC.style.display = modul()==='capitol'?'':'none';
    bBack.style.display='none'; bOk.style.display='none'; bNext.style.display='';
  };
  bOk.onclick=async ()=>{
    bOk.disabled=true;
    // A doua confirmare, cu tastarea cuvantului: stergerea nu poate porni dintr-un click gresit.
    const esteCapitol = plan.mod==='capitol';
    const ok = await confirmaDubla({
      titlu: esteCapitol ? 'Confirmi colapsarea capitolului?' : 'Confirmi stergerea leaf-ului?',
      rezumat: esteCapitol
        ? `Se sterg <b>${totLeafuri.length} leafuri</b> din &laquo;${esc(capDen)}&raquo;, care devine el insusi leaf.`
        : `Se sterge leaf-ul <span class="node-id">${esc(n.nod_id)}</span> &laquo;<b>${esc(n.denumire)}</b>&raquo;.`,
      detalii: esteCapitol
        ? ['toate articolele copiilor urca pe capitol', 'niciun P nu se pierde din dictionar']
        : [`are ${puri.length} ${puri.length===1?'articol':'articole'} pe el`,
           'articolele nebifate raman doar in dictionar, fara leaf',
           'se poate reveni imediat cu <b>&#8617; Reverse</b>'],
      textOk: esteCapitol ? 'Da, colapseaza' : 'Da, sterge leaf-ul',
      cuvant: 'STERG'});
    // confirmaDubla inlocuieste continutul overlay-ului, deci modalul de mai devreme nu mai
    // exista; la renuntare nu avem la ce reveni, doar anuntam ca nu s-a atins nimic.
    if(!ok){ toast('Anulat - nu s-a sters nimic.'); return; }
    try{
      let r;
      if(plan.mod==='capitol'){ r = await rpc('edit_colapseaza_capitol', { _capitol:capId }); }
      else { r = await rpc('edit_sterge_leafuri', { _leafuri:[n.nod_id], _assignari:plan._assignari }); }
      toast(r); closeModal(); await structRefreshArbore();
      delete nodeCache[n.nod_id]; if(capId) delete nodeCache[capId]; // leaful sters/capitolul colapsat nu mai au starea din cache
      showDetail(capId || n.nod_id);
    }catch(err){ toast(err.message, true); bOk.disabled=false; }
  };
}
function injecteazaGestiune(n){
  if(document.getElementById('struct-box')) return;
  const pane=document.getElementById('detail-pane'); if(!pane) return;
  const box=document.createElement('div'); box.className='section'; box.id='struct-box';
  let btns='';
  if(n.tip==='leaf'){
    btns = `<button class="btn primary" id="st-add-leaf">+ Adauga sub acest nod</button>`
      + ` <button class="btn danger" id="st-del-leaf">&#128465; Sterge acest leaf</button>`;
  } else {
    btns = `<button class="btn primary" id="st-add-leaf">+ Adauga leaf sau capitol</button>`
      + ` <button class="btn danger" id="st-del-nod">&#128465; Sterge acest capitol</button>`
      + ` <button class="btn" id="st-colaps" title="Sterge toate leafurile-copil; P-urile urca pe capitol care devine leaf">&#8600; Colapseaza capitolul in leaf</button>`;
  }
  box.innerHTML = `<h3>&#128295; Gestiune structura</h3><div class="editbar" style="margin:0">${btns}`
    + ` <button class="btn" id="st-reverse" title="Anuleaza ultima modificare de structura (pana la 3 pasi inapoi)">&#8617; Reverse <span id="st-undo-n" style="opacity:.7"></span></button></div>`;
  const sub=document.querySelector('#detail-pane .d-sub');
  if(sub) sub.after(box); else pane.prepend(box);
  const bAdd=document.getElementById('st-add-leaf'); if(bAdd) bAdd.onclick=()=>modalAdaugaNod(n);
  const bDel=document.getElementById('st-del-leaf'); if(bDel) bDel.onclick=()=>modalStergeLeaf(n);
  const bDelN=document.getElementById('st-del-nod'); if(bDelN) bDelN.onclick=()=>structStergeNod(n);
  const bRev=document.getElementById('st-reverse'); if(bRev) bRev.onclick=structReverse;
  undoLista().then(lst=>{ const s=document.getElementById('st-undo-n'); if(!s) return;
    if(lst.length){ s.textContent='('+lst.length+')'; if(bRev) bRev.title='Anuleaza: "'+(lst[0].descriere||'ultima')+'" - '+lst.length+' disponibile'; }
    else if(bRev){ bRev.disabled=true; bRev.style.opacity='.45'; bRev.title='Nimic de anulat'; }
  });
  const bCol=document.getElementById('st-colaps'); if(bCol) bCol.onclick=async ()=>{
    // colapsul merge doar daca toti copiii sunt leaf
    try{ const copii = await q(`/viz_noduri?parinte_id=eq.${encodeURIComponent(n.nod_id)}&select=tip`);
      if(!copii.length){ toast('Capitolul nu are copii.', true); return; }
      if(copii.some(c=>c.tip!=='leaf')){ toast('Colapsul merge doar pe capitole care au DOAR leafuri directe.', true); return; }
      structColapsaza(n.nod_id, n.denumire);
    }catch(e){ toast(e.message, true); }
  };
}

// ---- Panoul de detalii: gestiune structura (edit mode) + insigna evidenta AI ----
const _showDetailOrig = (typeof showDetail==='function') ? showDetail : null;
if(_showDetailOrig) showDetail = async function(id){
  await _showDetailOrig(id);
  // 1) butoane de gestiune structura, doar in modul Editare
  try{
    if(typeof EDIT!=='undefined' && EDIT){
      let n = nodeCache[id];
      if(!n || n.tip===undefined || n.parinte_id===undefined){
        n = (await q(`/viz_noduri?nod_id=eq.${encodeURIComponent(id)}&select=nod_id,parinte_id,tip,denumire`))[0];
      }
      if(n) injecteazaGestiune(n);
    }
  }catch(e){}
  // 2) insigna de evidenta AI
  try{
    const rows = await q(`/viz_ai_prompturi?nod_id=eq.${encodeURIComponent(id)}&select=tip,status,model,eroare,actualizat_la`);
    if(!rows.length) return;
    const numeTip = t => (AI_TIPURI.find(x=>x.id===t)||{}).nume || t;
    const box=document.createElement('div'); box.className='section'; box.id='ai-badge';
    box.innerHTML='<h3>&#10024; Evidenta AI</h3>' + rows.map(r=>{ const d=(r.actualizat_la||'').slice(0,16).replace('T',' ');
      return r.status==='ok'
        ? `<div class="kv" style="color:var(--green)">&#10004; ${esc(numeTip(r.tip))}: OFICIALIZAT (${esc(r.model||'')}, ${d})</div>`
        : `<div class="kv" style="color:#f87171">&#10008; ${esc(numeTip(r.tip))}: eroare la ${d} - ${esc((r.eroare||'').slice(0,140))} (se reia din matrice sau cu "doar erorile")</div>`;
    }).join('');
    const sub=document.querySelector('#detail-pane .d-sub'), pane=document.getElementById('detail-pane');
    const anchor=document.getElementById('struct-box')||sub;
    if(anchor) anchor.after(box); else if(pane) pane.prepend(box);
  }catch(e){}
};
</script>
