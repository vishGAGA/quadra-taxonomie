<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUADRA — Vizualizare Taxonomie</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --border:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --green:#34d399;
    --amber:#fbbf24; --leaf:#a78bfa; --p-col:#f472b6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden;}
  header{padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  header h1{font-size:17px; font-weight:600; color:var(--accent); white-space:nowrap;}
  header .stats{font-size:12px; color:var(--muted);}
  #search{flex:1; min-width:220px; max-width:480px; padding:8px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none;}
  #search:focus{border-color:var(--accent);}
  main{flex:1; display:flex; overflow:hidden;}
  #tree-pane{width:46%; min-width:340px; overflow-y:auto; border-right:1px solid var(--border); padding:10px 6px 40px 10px;}
  #detail-pane{flex:1; overflow-y:auto; padding:20px 24px 60px;}
  .node{user-select:none;}
  .node-row{display:flex; align-items:center; gap:6px; padding:3px 6px; border-radius:6px; cursor:pointer; font-size:13px; line-height:1.5;}
  .node-row:hover{background:var(--panel2);}
  .node-row.selected{background:#0c4a6e;}
  /* actiunile de structura de pe randul din arbore: apar la hover, ca sa nu incarce vizual arborele */
  .row-act{margin-left:auto; display:flex; gap:3px; opacity:0; transition:opacity .12s; flex-shrink:0;}
  .node-row:hover .row-act, .node-row.selected .row-act{opacity:1;}
  .ra{border:1px solid var(--border); background:var(--panel); color:var(--muted); border-radius:5px;
      width:22px; height:20px; line-height:1; font-size:12px; cursor:pointer; padding:0;}
  .ra:hover{background:var(--panel2); color:var(--text); border-color:var(--accent);}
  .ra-del:hover{color:#f87171; border-color:#f87171;}
  .caret{width:16px; text-align:center; color:var(--muted); font-size:10px; flex-shrink:0; transition:transform .15s;}
  .caret.open{transform:rotate(90deg);}
  .caret.empty{visibility:hidden;}
  .node-id{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--muted); flex-shrink:0;}
  .badge{font-size:9px; padding:1px 6px; border-radius:10px; flex-shrink:0; font-weight:600; letter-spacing:.4px;}
  .badge.leaf{background:#4c1d95; color:#ddd6fe;}
  .badge.familie{background:#14532d; color:#bbf7d0;}
  .badge.nivel{background:#1e3a5f; color:#bae6fd;}
  .badge.subcategorie{background:#713f12; color:#fef3c7;}
  .badge.specialitate{background:#7f1d1d; color:#fecaca;}
  .children{margin-left:18px; border-left:1px dashed #2c3a52; padding-left:4px; display:none;}
  .children.open{display:block;}
  .loading{color:var(--muted); font-size:12px; padding:4px 24px;}
  /* Detail pane */
  #detail-pane .placeholder{color:var(--muted); margin-top:40px; text-align:center; font-size:14px;}
  .crumb{font-size:11px; color:var(--muted); font-family:ui-monospace,Menlo,monospace; margin-bottom:6px; word-break:break-all;}
  .d-title{font-size:19px; font-weight:650; margin-bottom:4px;}
  .d-sub{font-size:12px; color:var(--muted); margin-bottom:16px; display:flex; gap:10px; align-items:center;}
  .section{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px;}
  .section h3{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin-bottom:8px;}
  .section p, .section div.txt{font-size:13.5px; line-height:1.65; color:var(--text); white-space:pre-wrap;}
  .kv{font-size:13px; line-height:1.6;}
  .kv b{color:var(--amber);}
  /* P list */
  .p-item{border:1px solid var(--border); border-radius:8px; margin-bottom:8px; overflow:hidden;}
  .p-head{display:flex; align-items:center; gap:10px; padding:9px 12px; cursor:pointer; background:var(--panel2); font-size:13px;}
  .p-head:hover{background:#31405c;}
  .p-id{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--p-col); flex-shrink:0;}
  .p-um{margin-left:auto; font-size:11px; color:var(--green); background:#052e1c; padding:2px 8px; border-radius:10px; flex-shrink:0;}
  .p-caret{color:var(--muted); font-size:10px; transition:transform .15s;}
  .p-caret.open{transform:rotate(90deg);}
  .prm-list{display:none; padding:8px 14px 12px; background:var(--bg);}
  .prm-list.open{display:block;}
  .prm-item{padding:7px 0; border-bottom:1px solid #1c2942; font-size:12.5px;}
  .prm-item:last-child{border-bottom:none;}
  .prm-name{color:var(--text); font-weight:600;}
  .prm-id{font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--muted); margin-left:6px;}
  .prm-tip{font-size:10px; color:var(--amber); margin-left:6px;}
  .prm-vals{color:var(--muted); margin-top:3px; line-height:1.5;}
  /* Search results */
  #search-results{display:none; padding:6px 10px;}
  .sr-item{padding:6px 10px; border-radius:6px; cursor:pointer; font-size:13px; display:flex; gap:8px; align-items:baseline;}
  .sr-item:hover{background:var(--panel2);}
  .sr-count{font-size:11px; color:var(--muted); padding:6px 10px;}
  /* Editare */
  .editswitch{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; white-space:nowrap; user-select:none;}
  .editswitch input{accent-color:var(--accent); width:15px; height:15px; cursor:pointer;}
  .editswitch.on{color:var(--amber); font-weight:600;}
  .btn{border:1px solid var(--border); background:var(--panel2); color:var(--text); font-size:11.5px; padding:4px 10px; border-radius:7px; cursor:pointer; line-height:1.4;}
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn.danger:hover{border-color:#f87171; color:#f87171;}
  .btn.primary{background:#0c4a6e; border-color:#0369a1;}
  .btn.mini{font-size:10.5px; padding:2px 7px; border-radius:6px;}
  .editbar{display:flex; gap:8px; margin:2px 0 10px;}
  .p-del{margin-left:8px;}
  .prm-actions{display:flex; gap:6px; margin-top:5px;}
  .prm-addbar{display:flex; gap:8px; padding:8px 0 2px;}
  /* Modal */
  #modal-overlay{display:none; position:fixed; inset:0; background:rgba(2,6,23,.72); z-index:50; align-items:flex-start; justify-content:center; padding:60px 16px;}
  #modal-overlay.open{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:12px; width:min(640px,96vw); max-height:78vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .modal h2{font-size:14px; padding:14px 16px 10px; color:var(--accent); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;}
  .modal h2 .btn{font-weight:400;}
  .modal .m-body{padding:14px 16px; overflow-y:auto; font-size:13px;}
  .modal input[type=text], .modal select, .modal textarea{width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:13px; outline:none; margin:4px 0 10px;}
  .modal input:focus, .modal textarea:focus{border-color:var(--accent);}
  .modal label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
  .m-results .sr-item{border:1px solid transparent;}
  .m-results .sr-item:hover{border-color:var(--accent);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px; min-height:26px;}
  .chip{background:#0c4a6e; border:1px solid #0369a1; border-radius:14px; font-size:11px; padding:3px 9px; display:flex; align-items:center; gap:6px;}
  .chip b{color:#7dd3fc; font-weight:600; font-family:ui-monospace,Menlo,monospace; font-size:10px;}
  .chip span.x{cursor:pointer; color:var(--muted);} .chip span.x:hover{color:#f87171;}
  .m-foot{padding:12px 16px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end;}
  .hint{font-size:11px; color:var(--muted); margin-bottom:8px; line-height:1.5;}
  #toast{position:fixed; bottom:18px; right:18px; z-index:99; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
  .toast-item{background:#052e1c; border:1px solid #34d399; color:#d1fae5; font-size:12.5px; padding:9px 14px; border-radius:9px; max-width:420px; box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .toast-item.err{background:#450a0a; border-color:#f87171; color:#fecaca;}
  /* Nomenclatoare */
  .modes{display:flex; gap:4px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:3px; flex-shrink:0;}
  .mode-btn{border:none; background:transparent; color:var(--muted); font-size:12px; padding:5px 11px; border-radius:6px; cursor:pointer; white-space:nowrap;}
  .mode-btn:hover{color:var(--text);}
  .mode-btn.active{background:var(--panel2); color:var(--accent); font-weight:600;}
  .gol-badge{display:none; background:#b45309; color:#fff; font-size:10px; font-weight:700; border-radius:9px; padding:1px 6px; margin-left:4px;}
  .gol-badge.on{display:inline-block;}
  .golfilt{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px 16px 4px;}
  .golchip{border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:16px; padding:5px 12px; font-size:12px; cursor:pointer; white-space:nowrap;}
  .golchip:hover{border-color:var(--accent);}
  .golchip.on{background:var(--panel2); border-color:var(--accent); color:var(--accent); font-weight:600;}
  .golchip b{font-weight:700;}
  .golnote{padding:2px 16px 10px; font-size:11.5px; color:var(--muted); line-height:1.5;}
  .gol-cat{display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:.04em; border-radius:4px; padding:2px 6px; white-space:nowrap;}
  .gol-cat.c1{background:#4a2f10; color:#fbbf24;}
  .gol-cat.c2{background:#3b1d3b; color:#e879f9;}
  .gol-cat.c3{background:#4c1d1d; color:#fca5a5;}
  .gol-cat.c4{background:#1e3a3a; color:#5eead4;}
  .gol-det{font-size:11.5px; color:var(--muted); line-height:1.55;}
  .gol-key{font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--accent); white-space:nowrap;}
  .gol-link{cursor:pointer; text-decoration:underline dotted;}
  .nom-item{display:flex; align-items:center; gap:9px; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12.5px; border-bottom:1px solid #1c2942;}
  .nom-item:hover{background:var(--panel2);}
  .nom-den{flex:1; min-width:0;}
  .nom-cnt{font-size:10.5px; color:var(--muted); flex-shrink:0; background:#1c2942; padding:1px 7px; border-radius:9px;}
  #nom-pane{flex:1; overflow-y:auto; display:none; padding:0 0 60px;}
  .nomtool{display:flex; gap:12px; align-items:center; padding:10px 14px 8px; flex-wrap:wrap;}
  .nomtool .sr-count{padding:0;}
  .nompag{display:flex; gap:8px; align-items:center; padding:6px 14px; flex-wrap:wrap; border-bottom:1px solid var(--border); background:var(--panel);}
  .nompag .pg-info{font-size:11.5px; color:var(--muted); white-space:nowrap;}
  .nompag button[disabled]{opacity:.35; cursor:default;}
  .nomtool select{padding:6px 9px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12px; outline:none; cursor:pointer;}
  .ntab{width:100%; border-collapse:collapse; font-size:12.5px;}
  .ntab th{position:sticky; top:0; background:var(--panel); text-align:left; padding:8px 12px; color:var(--accent); font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; border-bottom:1px solid var(--border); z-index:2;}
  .ntab td{padding:7px 12px; border-bottom:1px solid #1c2942; vertical-align:top;}
  .ntab tr.datarow{cursor:pointer;}
  .ntab tr.datarow:hover td{background:var(--panel2);}
  .ntab tr.datarow.open td{background:#12365a;}
  .ntab tr.exprow>td{background:var(--panel); padding:14px 18px; border-bottom:2px solid var(--border); cursor:default;}
  .exp-head{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:6px; font-size:13.5px;}
  .exp-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:10px;}
  .exp-grid h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--accent); margin-bottom:7px;}
  @media (max-width:900px){ .exp-grid{grid-template-columns:1fr;} }
  /* descrierea P-ului: intreaga in panoul deschis, taiata la 2 randuri in liste */
  .exp-desc{margin:10px 0 2px; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--panel2);}
  .exp-desc h4{font-size:10.5px; text-transform:uppercase; letter-spacing:.8px; color:var(--accent); margin-bottom:6px; display:flex; gap:8px; align-items:center;}
  .exp-desc .txt{font-size:13px; line-height:1.6;}
  .p-desc{font-size:12px; line-height:1.5; color:var(--muted); margin-top:3px;
          display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .p-item .p-desc{padding:7px 12px 9px 34px; margin:0; border-top:1px dashed var(--border);}
  .vchips{display:flex; flex-wrap:wrap; gap:5px; align-items:center;}
  .vchip{background:#1c2942; border:1px solid var(--border); border-radius:12px; padding:2px 10px; font-size:11.5px; display:inline-flex; gap:7px; align-items:center; line-height:1.5; white-space:nowrap;}
  .vchip.alta{border-style:dashed; color:var(--muted);}
  .vchip.edit{cursor:pointer;}
  .vchip.edit:hover{border-color:var(--accent);}
  .vchip .x{cursor:pointer; color:var(--muted); font-size:10px;}
  .vchip .x:hover{color:#f87171;}
  .vadd{display:flex; gap:6px; margin-top:6px; align-items:center; flex-wrap:wrap;}
  .vadd input{flex:1; min-width:140px; padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12px; outline:none;}
  .vadd input:focus{border-color:var(--accent);}
  /* Introducerea valorilor: UN CAMP = O VALOARE. Separatorul " / " ramane doar in drumul
     catre RPC, utilizatorul nu-l mai scrie si nu mai poate gresi lipind valorile. */
  .vgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:6px; width:100%;}
  .vgrid input{padding:5px 8px; border-radius:7px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12px; outline:none; width:100%;}
  .vgrid input:focus{border-color:var(--accent);}
  .vgrid-tool{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px;}
  .valprev{font-size:11px; color:var(--muted); line-height:1.7; margin-top:4px;}
  .valprev .vchip{font-size:10.5px; padding:1px 8px;}
  .vadd .valprev{flex-basis:100%; margin-top:0;}
  #pin-overlay{display:none; position:fixed; inset:0; background:rgba(2,6,23,.72); z-index:70; align-items:flex-start; justify-content:center; padding:120px 16px;}
  #pin-overlay.open{display:flex;}
  ::-webkit-scrollbar{width:10px;} ::-webkit-scrollbar-thumb{background:#334155; border-radius:6px;} ::-webkit-scrollbar-track{background:transparent;}
  @media (max-width:860px){ main{flex-direction:column;} #tree-pane{width:100%; height:45%; border-right:none; border-bottom:1px solid var(--border);} }
</style>
</head>
<body>
<header>
  <h1>QUADRA &mdash; Taxonomie categorii de constructii</h1>
  <div class="modes">
    <button class="mode-btn active" data-m="tree">Arbore</button>
    <button class="mode-btn" data-m="p">Nomenclator P</button>
    <button class="mode-btn" data-m="prm">Parametri</button>
    <button class="mode-btn" data-m="goluri">Goluri <span id="gol-badge" class="gol-badge"></span></button>
  </div>
  <input id="search" type="text" placeholder="Cauta dupa denumire sau ID (min 3 caractere)..." autocomplete="off">
  <span class="stats" id="stats">se incarca...</span>
  <label class="editswitch" id="edit-switch"><input type="checkbox" id="edit-toggle"> Editare</label>
</header>
<div id="modal-overlay"></div>
<div id="pin-overlay"></div>
<div id="toast"></div>
<main>
  <div id="tree-pane">
    <div id="search-results"></div>
    <div id="tree-root"></div>
  </div>
  <div id="detail-pane"><div class="placeholder">&#9668; Selecteaza un nod din arbore pentru a vedea detaliile.<br><br>Extinde cu sagetile, cauta sus, iar la leafuri da click pe un P pentru parametri.</div></div>
  <div id="nom-pane"></div>
</main>
<script>
const SB_URL = 'https://enlzznpzkdhbdsxffavf.supabase.co/rest/v1';
const SB_KEY = 'sb_publishable_4gcOldftRt1fav-gQGXBwg_VnakQ3t1';
const HDRS = { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY };

async function q(path){
  const r = await fetch(SB_URL + path, { headers: HDRS });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
// Aduce TOT setul care corespunde filtrului, paginand prin CURSOR pe cheia primara.
// Nu se foloseste offset: pe vederile cu agregate offset-ul mare depaseste timeout-ul
// serverului (masurat: peste ~1600 randuri raspunde 500), pe cand cursorul ramane constant.
// Pasul de pornire, pe vedere. NU e o optimizare, e o REGULA: coloanele de numarare
// (nr_utilizari, nr_leafuri, parametri) sunt subinterogari evaluate PE FIECARE RAND, iar
// serverul taie cererea la statement timeout peste un anumit numar de randuri. Masurat:
// viz_prm_nomenclator cedeaza peste 200, viz_p_param peste 500. Daca pornim mai sus,
// fiecare deschidere de tab lasa cate un HTTP 500 in logurile Supabase inainte sa scadem
// pasul. Pornim direct sub prag, ca sa nu generam erori deloc.
const PAS_INITIAL = [
  [/viz_prm_nomenclator/, 200],
  [/viz_p_param/,         400],
  [/viz_p_nomenclator/,   500],
];
function pasPentru(cale){
  const r = PAS_INITIAL.find(([re]) => re.test(cale));
  return r ? r[1] : 500;
}
// ATENTIE: paginarea e pe CURSOR (`cheie=gt.ultima_valoare`), deci `cheie` TREBUIE sa fie
// unica pe rand. Pe o coloana ne-unica se pierd tacit randurile care au aceeasi valoare cu
// ultimul rand al paginii — nu da eroare, doar lipsesc date. Aici se folosesc doar p_id si
// prm_id, care sunt unice.
async function qTot(bazaPath, cheie, onProgres){
  let pas = pasPentru(bazaPath), ultim = '', tot = [], esecuri = 0;
  for(;;){
    const sep = bazaPath.includes('?') ? '&' : '?';
    const url = `${bazaPath}${sep}order=${cheie}&limit=${pas}` + (ultim ? `&${cheie}=gt.${encodeURIComponent(ultim)}` : '');
    let d = null;
    try{
      const r = await fetch(SB_URL + url, { headers: HDRS });
      if(!r.ok) throw new Error(await r.text());
      d = await r.json();
    }catch(err){
      if(pas > 50){ pas = Math.floor(pas/2); continue; }     // serverul a cedat: cerem mai putin
      if(++esecuri <= 2){ await new Promise(r=>setTimeout(r, 800)); continue; }
      throw err;
    }
    esecuri = 0;
    tot = tot.concat(d);
    if(onProgres) onProgres(tot.length);
    if(d.length < pas) break;
    ultim = d[d.length-1][cheie];
    if(tot.length > 100000) break;
  }
  return tot;
}
let NOMREQ = 0;                       // generatia randarii curente; opreste randarile intarziate
let NOMCACHE = {};                    // (cale+sortare+cautare) -> {total, pagini:{n:randuri}}
function nomCacheReset(){ NOMCACHE = {}; }

// ---- Paginare PE SERVER, 200 de randuri odata ----
// Nomenclatoarele nu se mai descarca integral. Motivul nu e doar viteza: coloanele de
// numarare (nr_leafuri / nr_utilizari) sunt subinterogari evaluate PE FIECARE RAND, iar
// serverul taie cererea la 3 s. Masurat pe vederile de azi:
//   limit=200 offset=0     -> OK (0,6 s P / 1,5 s PRM)
//   limit=200 offset=1200  -> 500, statement timeout
// Deci OFFSET-ul mare e otrava. Solutia, in doi pasi, amandoi ieftini:
//   1. reperul paginii: acelasi order, dar cerand DOAR coloanele ieftine (planificatorul
//      arunca atunci subinterogarea) -> primim cheia de la care incepe pagina;
//   2. pagina insasi, ceruta prin cheie (`gte`), nu prin offset -> serverul taie randurile
//      inainte sa evalueze numaratoarea.
// Numaratoarea totala se cere separat, tot fara coloanele scumpe (~90 ms).
// Sortarea dupa numarul de utilizari nu se poate servi asa: cheia de sortare E coloana
// scumpa. Merge doar pe vederile rapide _v2 (migrarea vederi_rapide_nomenclator.sql).
let VEDERI_V2 = null;
async function areVederiV2(){
  if(VEDERI_V2 === null){
    try{ await q('/viz_p_nomenclator_v2?select=p_id&limit=1'); VEDERI_V2 = true; }
    catch(e){ VEDERI_V2 = false; }
  }
  return VEDERI_V2;
}
function citat(v){ return `"${String(v).replace(/"/g,'\\"')}"`; }
// cfg: {vedere, cheie, select, filtru, sortare, pagina, pas}
async function nomAduPagina(cfg){
  const {vedere, cheie, select, filtru, sortare, pagina, pas} = cfg;
  const de = pagina * pas;
  const [camp, dir] = sortare.split('.');
  const desc = dir === 'desc';

  const total = await (async ()=>{
    const r = await fetch(`${SB_URL}${vedere}?select=${cheie}${filtru}&limit=1`,
      { headers: {...HDRS, Prefer:'count=exact'} });
    if(!r.ok) throw new Error(await r.text());
    const cr = r.headers.get('content-range') || '';
    return parseInt(cr.split('/')[1], 10) || 0;
  })();
  if(!total) return {total:0, randuri:[]};

  // sortarea dupa coloana de numarare: doar cu vederi rapide, altfel nu se poate pagina
  if(camp !== cheie && camp !== 'denumire'){
    if(!await areVederiV2()) { const e = new Error('SORTARE_INDISPONIBILA'); e.sortare = camp; throw e; }
    const d = await q(`${vedere}_v2?select=${select}${filtru}&order=${sortare},${cheie}&limit=${pas}&offset=${de}`);
    return {total, randuri:d};
  }

  const ordine = camp === cheie ? cheie + (desc?'.desc':'') : `${camp}${desc?'.desc':''},${cheie}`;
  let filtruPagina = '';
  if(de > 0){
    // reperul: acelasi order, doar coloanele ieftine
    const rep = await q(`${vedere}?select=${camp===cheie?cheie:camp+','+cheie}${filtru}&order=${ordine}&limit=1&offset=${de}`);
    if(!rep.length) return {total, randuri:[]};
    const r0 = rep[0], op = desc ? 'lt' : 'gt';
    filtruPagina = camp === cheie
      ? `&${cheie}=${op}e.${encodeURIComponent(r0[cheie])}`
      : '&or=' + encodeURIComponent(`(${camp}.${op}.${citat(r0[camp])},and(${camp}.eq.${citat(r0[camp])},${cheie}.${op}e.${r0[cheie]}))`);
  }
  const d = await q(`${vedere}?select=${select}${filtru}&order=${ordine}&limit=${pas}${filtruPagina}`);
  return {total, randuri:d};
}
// In cache se pune PROMISIUNEA, nu rezultatul: doua randari pornite in acelasi timp pe
// aceeasi pagina (ex. schimb de sortare urmat imediat de cautare) impart o singura cerere.
function nomIncarcaPagina(cheieCache, cfg){
  const k = cheieCache + '|' + cfg.pagina;
  if(!NOMCACHE[k]){
    NOMCACHE[k] = nomAduPagina(cfg).catch(err=>{ delete NOMCACHE[k]; throw err; });
  }
  return NOMCACHE[k];
}
// Descrierile P-urilor stau intr-o vedere separata (viz_p_descriere), ca sa nu se atinga
// vederile care merg azi. Sunt 2.112 randuri mici: se aduc o singura data si raman in memorie.
// Daca migrarea `migrari/descriere_p.sql` nu e inca rulata in baza, vederea lipseste — nu e
// o eroare de pagina, doar nu exista descrieri; se spune asta acolo unde ar fi fost afisate.
// Se aduc DOAR pentru P-urile cerute (randurile de pe ecran), in loturi, si se tin in
// DESCPMAP; ce s-a adus o data nu se mai cere. Asa tabelul nu trage 2.112 descrieri ca sa
// afiseze 200 de randuri.
let DESCPMAP = {}, DESCP_CERUTE = new Set(), DESCP_LIPSA = false;
async function descPPentru(ids){
  const noi = (ids||[]).filter(id => id && !DESCP_CERUTE.has(id));
  if(noi.length && !DESCP_LIPSA){
    try{
      for(let i=0;i<noi.length;i+=150){
        const lot = noi.slice(i, i+150);
        const d = await q(`/viz_p_descriere?select=p_id,descriere&p_id=in.${encodeURIComponent('('+lot.join(',')+')')}`);
        d.forEach(r=>{ if(r.descriere) DESCPMAP[r.p_id] = r.descriere; });
        lot.forEach(id=> DESCP_CERUTE.add(id));
      }
    }catch(err){ DESCP_LIPSA = true; }   // vederea lipseste: migrarea nu e rulata
  }
  return DESCPMAP;
}
function descPReset(){ DESCPMAP = {}; DESCP_CERUTE = new Set(); DESCP_LIPSA = false; }
function descPGol(){
  return DESCP_LIPSA
    ? '<span class="hint" style="margin:0">migrarea <b>migrari/descriere_p.sql</b> nu e rulata inca in baza</span>'
    : '<span class="hint" style="margin:0">fara descriere</span>';
}

async function rpc(fn, args){
  const a = Object.assign({}, args||{});
  if(fn.indexOf('edit_')===0 && fn.indexOf('edit_cauta')!==0){
    if(!PIN && !(await cerePin())) throw new Error('Operatiunea are nevoie de PIN-ul de editare.');
    a._pin = PIN;
  }
  const r = await fetch(`${SB_URL}/rpc/${fn}`, { method:'POST', headers:{...HDRS,'Content-Type':'application/json'}, body: JSON.stringify(a) });
  const txt = await r.text();
  if(!r.ok){
    let m=txt; try{ m=JSON.parse(txt).message||txt; }catch(e){}
    m = m.replace(/^.*?:\s*/,'');
    if(m.indexOf('PIN de editare invalid')>=0){ PIN=''; localStorage.removeItem('quadra_pin'); }
    // Functie inexistenta in baza: mesajul brut al serverului nu ajuta pe nimeni. Il inlocuim,
    // dar MARCAM eroarea (`lipsa`), ca sa se poata recunoaste si dupa rescrierea textului —
    // altfel sonda de disponibilitate ar crede ca functia exista.
    const lipsa = /Could not find the function|schema cache/i.test(m);
    if(lipsa && /edit_elimina_|edit_sterge_prm_uri/.test(fn)){
      m = 'Stergerea definitiva nu e activata inca in baza de date. Trebuie rulata migrarea '+
          'migrari/stergere_definitiva_p_prm.sql (functiile edit_elimina_p_uri / edit_elimina_prm_uri / edit_sterge_prm_uri). '+
          'Pana atunci, foloseste optiunea "Retrage" pentru P-uri.';
    }
    const e = new Error(m); e.lipsa = lipsa; throw e;
  }
  try{ return JSON.parse(txt); }catch(e){ return txt; }
}

// (ce anume creezi / unde muti P-urile); asta e pasul final, care arata exact ce se intampla si
// cere o actiune deliberata. La stergeri, butonul de confirmare se activeaza abia dupa ce
// utilizatorul scrie cuvantul cerut — o apasare gresita nu mai poate distruge nimic.
// Rezolva cu true (confirmat) sau false (renuntat).
function confirmaDubla({titlu, rezumat, detalii, textOk, cuvant}){
  return new Promise(resolve=>{
    let raspuns=false;
    const lista = (detalii||[]).length
      ? `<ul style="margin:10px 0 0; padding-left:18px; font-size:12.5px; line-height:1.8">${detalii.map(d=>`<li>${d}</li>`).join('')}</ul>` : '';
    const camp = cuvant
      ? `<label class="lbl" style="margin-top:14px">Scrie <b>${esc(cuvant)}</b> ca sa confirmi</label>
         <input id="cd-cuv" autocomplete="off" placeholder="${esc(cuvant)}">` : '';
    const m = showModal(esc(titlu),
      `<div class="hint" style="margin:0 0 10px">Pasul 2 din 2 — confirmare finala.</div>
       <div style="padding:11px 13px;border:1px solid var(--border);border-radius:9px;background:var(--bg)">${rezumat}${lista}</div>${camp}`,
      `<button class="btn" id="cd-x">Renunta</button><button class="btn danger" id="cd-ok"${cuvant?' disabled':''}>${esc(textOk||'Confirm')}</button>`);
    const ok = m.querySelector('#cd-ok');
    if(cuvant){
      const inp = m.querySelector('#cd-cuv');
      inp.addEventListener('input', ()=>{ ok.disabled = inp.value.trim().toUpperCase() !== cuvant.toUpperCase(); });
      setTimeout(()=>inp.focus(), 60);
    }
    m.querySelector('#cd-x').onclick = ()=>{ closeModal(); };
    ok.onclick = ()=>{ raspuns=true; closeModal(); };
    const obs = new MutationObserver(()=>{ if(!overlay.classList.contains('open')){ obs.disconnect(); resolve(raspuns); } });
    obs.observe(overlay, {attributes:true, attributeFilter:['class']});
  });
}

const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// sortare naturala pe segmente numerice ale nod_id
function natCmp(a,b){
  const as=a.nod_id.split('.'), bs=b.nod_id.split('.');
  for(let i=0;i<Math.max(as.length,bs.length);i++){
    const x=as[i]||'', y=bs[i]||'';
    const nx=parseInt(x,10), ny=parseInt(y,10);
    if(!isNaN(nx)&&!isNaN(ny)){ if(nx!==ny) return nx-ny; }
    else if(x!==y) return x<y?-1:1;
  }
  return 0;
}

  const row = document.createElement('div'); row.className='node-row';
  row.innerHTML = `<span class="caret ${isLeaf?'empty':''}">&#9654;</span>
    <span class="node-id">${esc(n.nod_id)}</span>
    ${badge(n.tip)}
    <span class="node-name">${esc(n.denumire)}</span>`
    + (EDIT ? `<span class="row-act">
        <button class="ra ra-add" title="Adauga sub acest nod: leaf sau capitol">+</button>
        <button class="ra ra-del" title="Sterge acest nod">&#128465;</button>
      </span>` : '');
  const kids = document.createElement('div'); kids.className='children';
  wrap.appendChild(row); wrap.appendChild(kids);

  if(EDIT){
    // butoanele de structura nu trebuie sa selecteze/expandeze randul
    const bA = row.querySelector('.ra-add'), bD = row.querySelector('.ra-del');
    if(bA) bA.onclick = e => { e.stopPropagation(); modalAdaugaNod(n); };
    if(bD) bD.onclick = e => { e.stopPropagation(); structStergeNod(n); };
  }

  row.addEventListener('click', async (e)=>{
    selectNode(row, n.nod_id);
    if(isLeaf) return;
    const caret = row.querySelector('.caret');
    if(kids.classList.contains('open')){ kids.classList.remove('open'); caret.classList.remove('open'); return; }
    caret.classList.add('open'); kids.classList.add('open');
    if(!kids.dataset.loaded){
      kids.innerHTML = '<div class="loading">se incarca...</div>';
      await loadChildren(n.nod_id, kids);
    }
  });
  return wrap;
}

async function loadChildren(parentId, container){
  try{
    const rows = await q(`/viz_noduri?parinte_id=eq.${encodeURIComponent(parentId)}&select=nod_id,parinte_id,tip,denumire&limit=2000`);
    rows.sort(natCmp);
    container.innerHTML=''; container.dataset.loaded='1';
    rows.forEach(n=>container.appendChild(makeNode(n)));
    if(!rows.length) container.innerHTML='<div class="loading">fara copii</div>';
  }catch(err){ container.innerHTML='<div class="loading">eroare: '+esc(err.message)+'</div>'; }
}

function selectNode(row, id){
  if(selectedRow) selectedRow.classList.remove('selected');
  selectedRow = row; row.classList.add('selected');
  showDetail(id);
}

async function showDetail(id){
  currentId = id;
  detail.innerHTML = '<div class="placeholder">se incarca...</div>';
  try{
    let n = nodeCache[id];
    if(!n || n.descriere===undefined){
      const rows = await q(`/viz_noduri?nod_id=eq.${encodeURIComponent(id)}&select=*`);
      n = rows[0]; nodeCache[id]=n;
    }
    // lant complet (parintii)
    let crumbs=[], cur=n;
    const guard = 15;
    let hops=0;
    let pid = n.parinte_id;
    let chain=[n.denumire];
    while(pid && hops<guard){
      let p = nodeCache[pid];
      if(!p || p.denumire===undefined){
        const rows = await q(`/viz_noduri?nod_id=eq.${encodeURIComponent(pid)}&select=nod_id,parinte_id,tip,denumire`);
        p=rows[0]; if(p) nodeCache[pid]=Object.assign(nodeCache[pid]||{},p);
      }
      if(!p) break;
      chain.unshift(p.denumire);
      pid=p.parinte_id; hops++;
    }
    let html = `<div class="crumb">${esc(chain.join('  ›  '))}</div>
      <div class="d-title">${esc(n.denumire)}</div>
      <div class="d-sub"><span class="node-id">${esc(n.nod_id)}</span> ${badge(n.tip)}
        <span>${esc(n.status_generare||'')}${n.status_inchidere?' · '+esc(n.status_inchidere):''}</span>
        ${EDIT?'<button class="btn mini" id="edit-texte">&#9998; editeaza textele</button>':''}</div>`;
    const kv=[];
    if(n.descriere) kv.push(`<b>CE ESTE (context):</b> ${esc(n.descriere)}`);
    if(n.include_) kv.push(`<b>CONTINE (in interior):</b> ${esc(n.include_)}`);
    if(n.exclude_) kv.push(`<b>NU CONTINE (acelasi nivel — se mapeaza acolo):</b> ${esc(n.exclude_)}`);
    if(n.sinonime) kv.push(`<b>SINONIME / POSIBILE ARTICOLE:</b> ${esc(n.sinonime)}`);
    if(n.criteriu_asociere) kv.push(`<b>REGULA DE MAPARE:</b> ${esc(n.criteriu_asociere)}`);
    if(kv.length) html += `<div class="section"><h3>Descriere si Asociere</h3><div class="kv">${kv.join('<br><br>')}</div></div>`;
    const golP = '<span class="hint" style="margin:0">necompletat — activeaza Editare si apasa "editeaza textele"</span>';
    html += `<div class="section"><h3>Prompt pentru caiete de sarcini</h3><div class="txt">${n.prompt_caiete?esc(n.prompt_caiete):golP}</div></div>`;
    html += `<div class="section"><h3>Prompt pentru capitole</h3><div class="txt">${n.prompt_capitole?esc(n.prompt_capitole):golP}</div></div>`;

    if(n.tip==='leaf'){
      html += `<div class="section"><h3>P-uri (lista de cantitati)</h3><div id="p-editbar"></div><div id="p-list"><div class="loading">se incarca...</div></div></div>`;
      detail.innerHTML = html;
      if(EDIT){
        const bar=document.getElementById('p-editbar'); bar.className='editbar';
        bar.innerHTML = `<button class="btn" id="add-p-exist">+ ataseaza P existent</button><button class="btn primary" id="add-p-new">+ creeaza P nou</button><button class="btn" id="gen-p" title="propune P-urile pe care fratii acestui leaf le au si el nu">&#9881; genereaza P-uri</button>`;
        document.getElementById('add-p-exist').onclick = ()=> modalAtaseazaP(id);
        document.getElementById('add-p-new').onclick = ()=> modalCreeazaP(id);
        document.getElementById('gen-p').onclick = ()=> genP(id);
        const bt=document.getElementById('edit-texte'); if(bt) bt.onclick = ()=> modalEditeazaTexte(n);
      }
      const ps = await q(`/viz_leaf_p?leaf_id=eq.${encodeURIComponent(id)}&select=*&order=pozitie`);
      const dmap = await descPPentru(ps.map(x=>x.p_id));
      const plist = document.getElementById('p-list');
      if(!ps.length){ plist.innerHTML='<div class="loading">fara P-uri</div>'; return; }
      plist.innerHTML='';
      ps.forEach(p=>{
        const item=document.createElement('div'); item.className='p-item';
        item.innerHTML=`<div class="p-head"><span class="p-caret">&#9654;</span>
          <span class="p-id">${esc(p.p_id)}</span><span>${esc(p.denumire)}</span>
          <span class="p-um">${esc(p.um||'')}</span>${EDIT?`<button class="btn mini p-ren" title="redenumeste P-ul (se schimba pe TOATE leafurile)">&#9998;</button><button class="btn mini danger p-del" title="scoate P-ul de pe acest leaf">&#10005; scoate</button>`:''}</div>
          ${dmap[p.p_id]?`<div class="p-desc" title="${esc(dmap[p.p_id])}">${esc(dmap[p.p_id])}</div>`:''}
          <div class="prm-list"><div class="loading">...</div></div>`;
        const head=item.querySelector('.p-head'), list=item.querySelector('.prm-list'), caret=item.querySelector('.p-caret');
        if(EDIT){
          item.querySelector('.p-ren').addEventListener('click', (e)=>{
            e.stopPropagation();
            modalInput('Redenumeste '+p.p_id,
              'Denumirea se schimba automat pe TOATE leafurile care folosesc P-ul; denumirea veche ramane sinonim.',
              'Denumire noua', p.denumire, async v=>{
                if(!v.trim() || v.trim()===p.denumire) return;
                try{ const r = await rpc('edit_redenumeste_p',{_p:p.p_id,_denumire_noua:v}); toast(r); showDetail(id); }
                catch(err){ toast(err.message, true); }
              });
          });
          item.querySelector('.p-del').addEventListener('click', async (e)=>{
            e.stopPropagation();
            if(!confirm(`Scot ${p.p_id} "${p.denumire}" de pe leaf-ul ${id}?\n(P-ul ramane in dictionar; parametrii perechii se sterg)`)) return;
            try{ const r = await rpc('edit_sterge_p_de_pe_leaf',{_leaf:id,_p:p.p_id}); toast(r); showDetail(id); }
            catch(err){ toast(err.message, true); }
          });
        }
        head.addEventListener('click', async ()=>{
          if(list.classList.contains('open')){ list.classList.remove('open'); caret.classList.remove('open'); return; }
          list.classList.add('open'); caret.classList.add('open');
          if(!list.dataset.loaded) await renderPrms(list, id, p.p_id);
        });
        plist.appendChild(item);
      });
    } else {
      detail.innerHTML = html;
      if(EDIT){ const bt=document.getElementById('edit-texte'); if(bt) bt.onclick = ()=> modalEditeazaTexte(n); }
    }
  }catch(err){ detail.innerHTML='<div class="placeholder">Eroare: '+esc(err.message)+'</div>'; }
}

// ---- Randare parametri per pereche (cu actiuni in modul editare) ----
async function renderPrms(list, leafId, pId){
  try{
    const prms = await q(`/viz_leafp_prm?leaf_id=${encodeURIComponent('eq.'+leafId)}&p_id=${encodeURIComponent('eq.'+pId)}&select=*`);
    list.dataset.loaded='1';
    let inner = prms.length ? prms.map(m=>
      `<div class="prm-item"><span class="prm-name">${esc(m.denumire)}</span><span class="prm-id">${esc(m.prm_id)}</span><span class="prm-tip">${esc(m.tip||'')}</span>
       <div class="vchips" data-prm="${esc(m.prm_id)}" style="margin-top:4px">${chipsHTML(m.valori_lista, EDIT)}</div>
       ${EDIT?`<div class="prm-actions">
          <button class="btn mini" data-act="vals" data-prm="${esc(m.prm_id)}">+ valori</button>
          <button class="btn mini danger" data-act="del" data-prm="${esc(m.prm_id)}">&#10005; sterge parametrul</button>
        </div>`:''}</div>`).join('')
      : '<div class="loading">fara parametri</div>';
    if(EDIT) inner += `<div class="prm-addbar">
        <button class="btn mini" data-act="add-exist">+ parametru existent</button>
        <button class="btn mini primary" data-act="add-new">+ parametru NOU</button>
        <button class="btn mini" data-act="gen-prm" title="propune parametrii folositi de acest P in alte contexte, cu verificare anti-dubluri">&#9881; genereaza parametri</button></div>`;
    list.innerHTML = inner;
    if(!EDIT) return;
    // Valorile devin chip-uri editabile si in arbore: click = redenumeste, x = sterge valoarea.
    // Pana acum se randau cu editable=false, deci o valoare gresita nu putea fi scoasa decat
    // din nomenclatorul de parametri.
    list.querySelectorAll('.vchips[data-prm]').forEach(box=> wireChips(box, box.dataset.prm));
    list.querySelectorAll('[data-act]').forEach(b=>{
      b.onclick = async (e)=>{
        e.stopPropagation();
        const act=b.dataset.act, prm=b.dataset.prm;
        try{
          if(act==='del'){
            if(!confirm(`Sterg parametrul ${prm} de pe perechea (${leafId}, ${pId})?`)) return;
            await rpc('edit_sterge_prm_de_pe_pereche',{_leaf:leafId,_p:pId,_prm:prm});
            toast('Parametru sters.'); list.dataset.loaded=''; await renderPrms(list, leafId, pId);
          } else if(act==='vals'){
            modalValori('Adauga valori la '+prm,
              'Valorile noi se adauga la lista existenta, inaintea optiunii "alta valoare". <b>Cate o valoare in fiecare camp</b> — nu mai scrii separatori.',
              [], async vals=>{
                try{
                  await rpc('edit_adauga_valori_prm',{_prm:prm,_valori_noi:vals.join(' / ')});
                  toast(vals.length+' valori adaugate la '+prm+'.'); list.dataset.loaded=''; await renderPrms(list, leafId, pId);
                }catch(err){ toast(err.message, true); }
              });
          } else if(act==='gen-prm'){
            genPrm(leafId, pId, list);
          } else if(act==='add-exist'){
            const m = showModal('Adauga parametru existent pe '+pId, `
              <label>Cauta in dictionarul PRM</label><input type="text" id="ap-q" placeholder="denumire sau PRM-...">
              <div class="m-results" id="ap-res"></div>`);
            wireSearch(m.querySelector('#ap-q'), m.querySelector('#ap-res'),
              v=>rpc('edit_cauta_prm',{q:v}),
              r=>`<div class="sr-item"><span class="node-id">${esc(r.prm_id)}</span><span>${esc(r.denumire)}</span><span class="prm-tip">${esc(r.tip||'')}</span></div>`,
              async r=>{
                try{ await rpc('edit_adauga_prm_pe_pereche',{_leaf:leafId,_p:pId,_prm:r.prm_id});
                  closeModal(); toast(r.prm_id+' adaugat.'); list.dataset.loaded=''; await renderPrms(list, leafId, pId);
                }catch(err){ toast(err.message, true); }
              });
          } else if(act==='add-new'){
            const m = showModal('Parametru NOU pe '+pId, `
              <label>Denumire</label><input type="text" id="cp-den">
              <label>Tip</label><select id="cp-tip"><option value="lista deschisa">lista deschisa (+ alta valoare)</option><option value="lista">lista inchisa</option></select>
              <label>UM (optional)</label><input type="text" id="cp-um" placeholder="mm / cm / kW ...">
              <label>Valori — cate una in fiecare camp</label><div id="cp-val">${campuriValoriHTML([])}</div>`,
              `<button class="btn primary" id="cp-ok">creeaza si ataseaza</button>`);
            campuriValoriWire(m.querySelector('#cp-val'));
            m.querySelector('#cp-ok').onclick = async ()=>{
              try{
                const idn = await rpc('edit_creeaza_prm',{_denumire:m.querySelector('#cp-den').value,_um:m.querySelector('#cp-um').value||null,
                  _valori:campuriValoriCitite(m.querySelector('#cp-val')).join(' / '),_tip:m.querySelector('#cp-tip').value,_leaf:leafId,_p:pId});
                closeModal(); toast('Creat si atasat: '+idn); list.dataset.loaded=''; await renderPrms(list, leafId, pId);
              }catch(err){ toast(err.message, true); }
            };
          }
        }catch(err){ toast(err.message, true); }
      };
    });
  }catch(err){ list.innerHTML='<div class="loading">eroare</div>'; }
}

// ---- Modal editare texte descriptive (orice nod: leaf sau categorie) ----
function modalEditeazaTexte(n){
  const m = showModal('Editeaza textele — '+esc(n.nod_id)+' '+esc(n.denumire), `
    <div class="hint">Un singur camp, impartit prin titlurile de sectiune (CE ESTE / CONTINE / NU CONTINE / SINONIME / REGULA DE MAPARE) — pastreaza titlurile pe randul lor, editeaza liber textul de sub ele. Se salveaza doar sectiunile modificate. Reguli automate: CE ESTE minim 200 caractere la leaf (80 la nod superior), fara texte identice cu un frate, diacriticele se curata singure.</div>
    <label>Descriere si Asociere (un singur camp — sectiunile raman separate prin titlurile lor)</label>
    <textarea id="tx-da" rows="16"></textarea>
    <label>Prompt pentru caiete de sarcini</label><textarea id="tx-pc" rows="5" placeholder="instructiunile pe baza carora se genereaza caietul de sarcini pentru acest leaf..."></textarea>
    <label>Prompt pentru capitole</label><textarea id="tx-pk" rows="5" placeholder="instructiunile pe baza carora se genereaza capitolele..."></textarea>`,
    `<button class="btn" id="tx-cancel">renunta</button><button class="btn primary" id="tx-ok">salveaza</button>`);
  m.querySelector('#tx-da').value =
    'CE ESTE:\n'+(n.descriere||'')+'\n\nCONTINE:\n'+(n.include_||'')+'\n\nNU CONTINE:\n'+(n.exclude_||'')+
    '\n\nSINONIME:\n'+(n.sinonime||'')+'\n\nREGULA DE MAPARE:\n'+(n.criteriu_asociere||'');
  m.querySelector('#tx-pc').value = n.prompt_caiete||'';
  m.querySelector('#tx-pk').value = n.prompt_capitole||'';
  m.querySelector('#tx-cancel').onclick = closeModal;
  m.querySelector('#tx-ok').onclick = async ()=>{
    const val = s => m.querySelector(s).value;
    const chg = (v, old) => (v.trim() !== (old||'').trim()) ? v : null;
    const buckets = {'CE ESTE':'', 'CONTINE':'', 'NU CONTINE':'', 'SINONIME':'', 'REGULA DE MAPARE':''};
    let cur = null;
    for(const line of val('#tx-da').split('\n')){
      const k = line.trim().replace(/:$/,'').toUpperCase();
      if(buckets[k] !== undefined){ cur = k; continue; }
      if(cur !== null) buckets[cur] += (buckets[cur] ? '\n' : '') + line;
    }
    for(const k in buckets) buckets[k] = buckets[k].trim();
    const args = {_nod:n.nod_id,
      _descriere: chg(buckets['CE ESTE'], n.descriere),
      _sinonime:  chg(buckets['SINONIME'], n.sinonime),
      _include:   chg(buckets['CONTINE'], n.include_),
      _exclude:   chg(buckets['NU CONTINE'], n.exclude_),
      _criteriu:  chg(buckets['REGULA DE MAPARE'], n.criteriu_asociere)};
    const pc = chg(val('#tx-pc'), n.prompt_caiete);
    const pk = chg(val('#tx-pk'), n.prompt_capitole);
    const areTexte = !(args._descriere===null && args._sinonime===null && args._include===null && args._exclude===null && args._criteriu===null);
    if(!areTexte && pc===null && pk===null){ toast('Nimic modificat.'); closeModal(); return; }
    try{
      if(areTexte) toast(await rpc('edit_seteaza_descrieri', args));
      if(pc!==null || pk!==null) toast(await rpc('edit_seteaza_prompturi', {_nod:n.nod_id, _caiete:pc, _capitole:pk}));
      closeModal();
      nodeCache[n.nod_id] = {nod_id:n.nod_id, parinte_id:n.parinte_id, tip:n.tip, denumire:n.denumire};
      showDetail(n.nod_id);
    }catch(err){ toast(err.message, true); }
  };
}

// ---- Valori ca elemente unice (chip-uri): separatorul e ' / ' CU spatii; C20/25, TCP/IP raman intregi ----
const splitVals = s => (s||'').split(/\s+\/\s+/).map(x=>x.trim()).filter(Boolean);
function chipsHTML(valori, editable){
  const vals = splitVals(valori);
  if(!vals.length) return '<span class="hint" style="margin:0">fara valori</span>';
  return vals.map(v=>{
    if(v.toLowerCase()==='alta valoare') return `<span class="vchip alta" title="optiune obligatorie la listele deschise (E2)">${esc(v)}</span>`;
    return `<span class="vchip${editable?' edit':''}" data-val="${esc(v)}"${editable?' title="click = redenumeste; x = sterge"':''}>${esc(v)}${editable?'<span class="x" title="sterge valoarea">&#10005;</span>':''}</span>`;
  }).join('');
}
// ---- Valori de parametru: cate un camp pentru fiecare valoare ----
// RPC-ul primeste tot un singur text separat cu " / ", dar separatorul nu mai e treaba
// utilizatorului: el completeaza casute distincte, cate una pe valoare. Asa dispare
// greseala clasica (valori scrise lipit, care ajungeau un singur element in lista).
const NR_CAMPURI_VAL = 5;
function campuriValoriHTML(initiale){
  const vals = initiale || [];
  const n = Math.max(NR_CAMPURI_VAL, vals.length + 1);
  let h = '<div class="vgrid">';
  for(let i=0;i<n;i++) h += `<input type="text" class="vfield" placeholder="valoarea ${i+1}" value="${esc(vals[i]||'')}">`;
  h += `</div><div class="vgrid-tool"><button type="button" class="btn mini" data-act="vmai">+ inca un camp</button>
        <span class="hint" style="margin:0">un camp = o valoare; nu trebuie completate toate</span></div>
        <div class="valprev"></div>`;
  return h;
}
function campuriValoriCitite(root){
  return Array.from(root.querySelectorAll('.vfield')).map(i=>i.value.trim()).filter(Boolean);
}
function campuriValoriWire(root){
  const prev = root.querySelector('.valprev');
  const upd = ()=>{
    if(!prev) return;
    const vals = campuriValoriCitite(root).filter(v=> v.toLowerCase()!=='alta valoare');
    prev.innerHTML = vals.length
      ? `va salva <b>${vals.length}</b> ${vals.length>1?'valori separate':'valoare'}: ` + vals.map(v=>`<span class="vchip">${esc(v)}</span>`).join(' ')
      : '';
  };
  root.addEventListener('input', upd);
  const b = root.querySelector('[data-act="vmai"]');
  if(b) b.onclick = ()=>{
    const g = root.querySelector('.vgrid');
    const i = document.createElement('input');
    i.type='text'; i.className='vfield'; i.placeholder='valoarea '+(g.children.length+1);
    g.appendChild(i); i.focus();
  };
  root.querySelectorAll('.vfield').forEach(i=> i.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); const ok = root.closest('.modal')?.querySelector('#mv-ok'); if(ok) ok.click(); }
  }));
  upd();
  return ()=> campuriValoriCitite(root);
}
// Modal cu campuri separate. onOk primeste un ARRAY de valori (niciodata gol).
function modalValori(titlu, hint, initiale, onOk){
  const m = showModal(esc(titlu), `<div class="hint">${hint}</div><div id="mv-box">${campuriValoriHTML(initiale)}</div>`,
    `<button class="btn" id="mv-c">renunta</button><button class="btn primary" id="mv-ok">salveaza</button>`);
  const box = m.querySelector('#mv-box');
  const citeste = campuriValoriWire(box);
  m.querySelector('#mv-c').onclick = closeModal;
  m.querySelector('#mv-ok').onclick = ()=>{
    const vals = citeste();
    if(!vals.length){ toast('Completeaza cel putin un camp.', true); return; }
    closeModal(); onOk(vals);
  };
  setTimeout(()=>{ const f = box.querySelector('.vfield'); if(f) f.focus(); }, 60);
}
function rerenderChips(box, prm, lista){
  box.innerHTML = chipsHTML(lista, EDIT);
  wireChips(box, prm);
}
function wireChips(box, prm){
  if(!EDIT) return;
  box.querySelectorAll('.vchip.edit').forEach(ch=>{
    const val = ch.dataset.val;
    ch.querySelector('.x').onclick = async (e)=>{
      e.stopPropagation();
      if(!confirm(`Sterg valoarea "${val}" din ${prm}?`)) return;
      try{ const lista = await rpc('edit_prm_sterge_valoare',{_prm:prm,_valoare:val}); toast('Valoare stearsa din '+prm+'.'); rerenderChips(box, prm, lista); }
      catch(err){ toast(err.message, true); }
    };
    ch.onclick = (e)=>{
      if(e.target.classList.contains('x')) return;
      e.stopPropagation();
      modalInput('Redenumeste valoarea — '+prm,
        'Valoarea se inlocuieste pe pozitia ei din lista. Slash-ul din interiorul unei valori (ex: C20/25) e permis.',
        'Valoare', val, async v=>{
          if(!v.trim() || v.trim()===val) return;
          try{ const lista = await rpc('edit_prm_redenumeste_valoare',{_prm:prm,_veche:val,_noua:v}); toast('Valoare redenumita in '+prm+'.'); rerenderChips(box, prm, lista); }
          catch(err){ toast(err.message, true); }
        });
    };
  });
}

// ================= GOLURI (index: ce nu s-a mapat / ce lipseste din arbore) =================
let GOLURI = null, GOLFILT = '';
const GOLCLS = { 'Rand de deviz neincadrat':'c1', 'P fara leaf':'c2', 'Exceptie structurala':'c3', 'Leaf fara criteriu de asociere':'c4' };
const GOLEXPL = {
  'Rand de deviz neincadrat': 'Linii din devizele importate care nu au primit un P. Fie lipseste locul in arbore (galben, se rezolva cu structura), fie linia nu e produs (cod, "idem", diferenta de pret, manopera generica).',
  'P fara leaf': 'P-uri active in dictionar care nu sunt atasate niciunui leaf. Nu apar in nicio fisa de lucrare pana nu primesc un loc.',
  'Exceptie structurala': 'Decizii de structura semnalate si lasate deschise: familii sau leafuri care lipsesc din arbore, plus contaminari de mapare.',
  'Leaf fara criteriu de asociere': 'Leafuri marcate GENERAT dar cu campul criteriu_asociere gol — au descriere, dar nu au regula de incadrare.'
};

async function renderGoluri(v){
  nomPane.innerHTML = '<div class="loading" style="padding:16px">se incarca...</div>';
  try{
    if(!GOLURI) GOLURI = await q('/viz_goluri?select=*&order=ord,categorie,cheie&limit=2000');
    const badge = document.getElementById('gol-badge');
    if(badge){ badge.textContent = GOLURI.length; badge.classList.add('on'); }
    const cats = {};
    GOLURI.forEach(g=> cats[g.categorie] = (cats[g.categorie]||0)+1);
    const term = (v||'').toLowerCase();
    let rows = GOLURI.filter(g=> (!GOLFILT || g.categorie===GOLFILT));
    if(term) rows = rows.filter(g=> (g.denumire+' '+g.detaliu+' '+g.cheie+' '+g.subcategorie+' '+g.context).toLowerCase().includes(term));

    const chips = `<div class="golchip${GOLFILT?'':' on'}" data-c="">Toate <b>${GOLURI.length}</b></div>` +
      Object.entries(cats).map(([c,n])=>`<div class="golchip${GOLFILT===c?' on':''}" data-c="${esc(c)}">${esc(c)} <b>${n}</b></div>`).join('');
    const expl = GOLFILT ? GOLEXPL[GOLFILT] : 'Index al lucrurilor ramase de decis: randuri de deviz care nu au putut fi incadrate, P-uri fara leaf, exceptii structurale deschise si leafuri cu text incomplet. Click pe un cod PU- deschide P-ul in nomenclator; click pe un cod de nod il deschide in arbore.';

    const head = `<tr><th style="width:150px">Categorie</th><th style="width:150px">Tip</th><th style="width:90px">Cod</th><th style="width:30%">Denumire</th><th>Detaliu / nota</th><th style="width:16%">Context</th></tr>`;
    const body = rows.map(g=>{
      const isP = /^PU-\d+$/.test(g.cheie), isNod = /^[A-Z]{3}(\.\d+)+$/.test(g.cheie);
      const key = (isP||isNod) ? `<span class="gol-key gol-link" data-go="${isP?'p':'nod'}" data-id="${esc(g.cheie)}">${esc(g.cheie)}</span>` : `<span class="gol-key">${esc(g.cheie)}</span>`;
      return `<tr><td><span class="gol-cat ${GOLCLS[g.categorie]||''}">${esc(g.categorie)}</span></td>
        <td class="gol-det">${esc(g.subcategorie)}</td>
        <td>${key}</td>
        <td><b>${esc(g.denumire)}</b>${g.um?` <span class="p-um">${esc(g.um)}</span>`:''}</td>
        <td class="gol-det">${esc(g.detaliu)}</td>
        <td class="gol-det">${esc(g.context)}</td></tr>`;
    }).join('');

    nomPane.innerHTML = `<div class="golfilt">${chips}</div><div class="golnote">${esc(expl)}</div>`
      + `<div class="nomtool"><span class="sr-count">${rows.length} intrari${term?' care contin "'+esc(v)+'"':''}</span>
         <span class="hint" style="margin:0">lista se discuta si se inchide pe masura ce se iau deciziile de structura</span></div>`
      + `<table class="ntab"><thead>${head}</thead><tbody>${body}</tbody></table>`
      + (rows.length ? '' : '<div class="loading" style="padding:16px">nimic gasit</div>');

    nomPane.querySelectorAll('.golchip').forEach(c=> c.onclick = ()=>{ GOLFILT = c.dataset.c; renderGoluri(curSearch()); });
    nomPane.querySelectorAll('.gol-link').forEach(el=> el.onclick = ()=>{
      if(el.dataset.go==='p') gotoNom('p', el.dataset.id);
      else { setMode('tree'); showDetail(el.dataset.id); }
    });
  }catch(err){ nomPane.innerHTML = '<div class="loading" style="padding:16px">eroare: '+esc(err.message)+'</div>'; }
}

      nomPane.querySelectorAll('.prm-sel').forEach(cb=> cb.addEventListener('change', updDel));

        const disp = {retras:    await rpcDisponibil('edit_sterge_prm_uri',  {_prm_uri:['ZZ-0000']}),
                      definitiv: await rpcDisponibil('edit_elimina_prm_uri', {_prm_uri:['ZZ-0000']})};
        const def = await cereModStergere('parametru', chosen.length, lista, disp);
        if(!def) return;
        const fn = def==='definitiv'?'edit_elimina_prm_uri':'edit_sterge_prm_uri';
        try{
          toast(await rpc(fn,{_prm_uri:chosen.map(c=>c.id)}));
          nomCacheReset(); renderNomTable(curSearch());
        }catch(err){ toast(eRPCLipsa(err)?mesajRPCLipsa(fn):err.message, true); }
      };
    }
    nomPane.querySelectorAll('tr.datarow').forEach(tr=>{
      tr.addEventListener('click', e=>{
        if(e.target.closest('button,input,select,textarea,.vadd')) return;
        toggleExp(tr);
      });
    });
    if(EDIT && MODE==='prm'){
      nomPane.querySelectorAll('.vchips[data-prm]').forEach(box=> wireChips(box, box.dataset.prm));
      nomPane.querySelectorAll('[data-act="vadd"]').forEach(b=> b.onclick = ()=> valAdd(b));
      nomPane.querySelectorAll('[data-act="vset"]').forEach(b=> b.onclick = ()=> valSet(b));
    }
    if(PENDING_EXPAND){
      const tr = nomPane.querySelector(`tr.datarow[data-id="${PENDING_EXPAND}"]`);
      PENDING_EXPAND = null;
      if(tr){ toggleExp(tr); tr.scrollIntoView({block:'center'}); }
    }
  }catch(err){
    if(gen !== NOMREQ) return;
    // Sortarea dupa numarul de utilizari nu se poate pagina pe vederile de azi: cheia de
    // sortare e chiar coloana scumpa. Nu lasam ecranul gol — revenim la sortarea pe cod si
    // spunem de ce.
    if(err.message === 'SORTARE_INDISPONIBILA'){
      NOMSORT[nomKey()] = MODE==='p' ? 'p_id' : 'prm_id';
      NOMPAGE[nomKey()] = 0;
      toast('Sortarea dupa cate ori e folosit cere vederile rapide din migrari/vederi_rapide_nomenclator.sql. '
          + 'Pana atunci raman sortarea pe cod.', true);
      return renderNomTable(v);
    }
    nomPane.innerHTML = '<div class="loading" style="padding:16px">eroare: '+esc(err.message)+'</div>';
  }
}

function toggleExp(tr){
  const id = tr.dataset.id;
  const old = nomPane.querySelector('tr.exprow');
  const wasOpen = EXPANDED===id;
  if(old) old.remove();
  nomPane.querySelectorAll('tr.datarow.open').forEach(x=>x.classList.remove('open'));
  if(wasOpen){ EXPANDED=null; return; }
  EXPANDED = id;
  tr.classList.add('open');
  const exp = document.createElement('tr'); exp.className='exprow';
  const td = document.createElement('td'); td.colSpan = tr.children.length;
  exp.appendChild(td);
  tr.after(exp);
  if(MODE==='p') renderPExp(td, id); else renderPrmExp(td, id);
}

function modalInput(title, hint, label, initial, onOk, opts){
  opts = opts||{};
  const field = opts.select ? `<select id="mi-v">${opts.select.map(o=>`<option${o===initial?' selected':''}>${esc(o)}</option>`).join('')}</select>`
    : opts.textarea ? `<textarea id="mi-v" rows="4"></textarea>`
    : `<input type="text" id="mi-v">`;
  const m = showModal(esc(title), `${hint?`<div class="hint">${esc(hint)}</div>`:''}<label>${esc(label)}</label>${field}`,
    `<button class="btn" id="mi-c">renunta</button><button class="btn primary" id="mi-ok">salveaza</button>`);
  const el = m.querySelector('#mi-v');
  if(!opts.select) el.value = initial||'';
  m.querySelector('#mi-c').onclick = closeModal;
  m.querySelector('#mi-ok').onclick = ()=>{ const v = el.value; closeModal(); onOk(v); };
  if(el.tagName==='INPUT') el.addEventListener('keydown', e=>{ if(e.key==='Enter') m.querySelector('#mi-ok').click(); });
  setTimeout(()=> el.focus(), 60);
}

const searchBox=document.getElementById('search');

async function doSearch(v){
  searchResults.style.display='block'; treeRoot.style.display='none';
  searchResults.innerHTML='<div class="loading">se cauta...</div>';
  try{
    const enc=encodeURIComponent('%'+v+'%');
    const rows=await q(`/viz_noduri?or=(denumire.ilike.${enc},nod_id.ilike.${enc})&select=nod_id,parinte_id,tip,denumire&limit=200`);
    rows.sort(natCmp);
    searchResults.innerHTML = `<div class="sr-count">${rows.length} rezultate${rows.length===200?' (primele 200)':''} — sterge cautarea pentru arbore</div>` +
      rows.map(n=>`<div class="sr-item" data-id="${esc(n.nod_id)}"><span class="node-id">${esc(n.nod_id)}</span>${badge(n.tip)}<span>${esc(n.denumire)}</span></div>`).join('');
    searchResults.querySelectorAll('.sr-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        const n = rows.find(r=>r.nod_id===el.dataset.id);
        nodeCache[n.nod_id]=Object.assign(nodeCache[n.nod_id]||{},n);
        if(selectedRow) selectedRow.classList.remove('selected');
        el.classList.add('selected'); selectedRow=el;
        showDetail(n.nod_id);
      });
    });
  }catch(err){ searchResults.innerHTML='<div class="loading">eroare: '+esc(err.message)+'</div>'; }
}

<script>
/* ==== AI: prompturi oficiale (runner fundal + reluare erori + matrice ca mod) ==== */
const AI_FN_URL = 'https://enlzznpzkdhbdsxffavf.supabase.co/functions/v1/ai-descrieri';
const AI_TIPURI = [
  { id:'descriere', nume:'Descriere si Asociere', activ:true },
  { id:'caiete',    nume:'Prompt pentru caiete de sarcini', activ:true },
  { id:'capitole',  nume:'Prompt pentru capitole', activ:true },
];
const AI_MODELE = [
  { id:'claude-opus-5',   nume:'Claude Opus 5 (recomandat - calitate maxima)', cost:'~0.04-0.08 $/nod' },
  { id:'claude-sonnet-5', nume:'Claude Sonnet 5 (echilibrat)',                 cost:'~0.02-0.04 $/nod' },
  { id:'claude-haiku-4-5',nume:'Claude Haiku 4.5 (rapid si ieftin)',           cost:'~0.005-0.01 $/nod' },
];

(function aiFaraPin(){
  try{ if(!localStorage.getItem('quadra_pin')) localStorage.setItem('quadra_pin','x'); }catch(e){}
  try{ if(typeof PIN!=='undefined' && !PIN) PIN='x'; }catch(e){}
})();

const AI = { running:false, stop:false, cfg:null, facut:0, total:null, ramase:null, erori:0, ultima:'' };
const AI_LOGS = [];
function aiLog(t, err){ AI_LOGS.unshift({t,err}); if(AI_LOGS.length>250) AI_LOGS.pop();
  const lg=document.getElementById('ai-log'); if(lg){ const d=document.createElement('div'); if(err)d.style.color='#f87171'; d.textContent=t; lg.prepend(d); } }

// ---- Buton in antet + fila "Matrice" in grupul de moduri ----
(function aiInit(){
  function monteaza(){
    const gazda = document.querySelector('header') || document.body;
    if(!gazda) return false;
    if(!document.getElementById('ai-desc-btn')){
      const b=document.createElement('button'); b.className='btn primary'; b.id='ai-desc-btn';
      b.innerHTML='&#10024; AI prompturi'; b.style.marginLeft='auto';
      b.title='Dezvolta prompturile oficiale cu Claude (ruleaza in fundal)'; b.onclick=aiModal;
      gazda.appendChild(b);
    }
    // fila de mod "Matrice" langa Arbore/Nomenclator P/Parametri
    const modes=document.querySelector('.modes');
    if(modes && !modes.querySelector('[data-m="matrice"]')){
      const t=document.createElement('button'); t.className='mode-btn'; t.dataset.m='matrice'; t.textContent='Matrice';
      t.onclick=()=>setMode('matrice'); modes.appendChild(t);
    }
    return true;
  }
  if(!monteaza()) document.addEventListener('DOMContentLoaded', monteaza);
})();

// ---- Extind setMode ca sa randeze matricea in panoul principal (mod permanent) ----
if(typeof setMode==='function'){
  const _setModeOrig = setMode;
  setMode = function(m){
    if(m==='matrice'){
      MODE='matrice';
      document.querySelectorAll('.mode-btn').forEach(b=> b.classList.toggle('active', b.dataset.m==='matrice'));
      try{ treePane.style.display='none'; }catch(e){}
      try{ detail.style.display='none'; }catch(e){}
      const np = document.getElementById('nom-pane');
      if(np){ np.style.display='block'; renderMatricePane(np); }
      const sr=document.getElementById('search-results'); if(sr) sr.style.display='none';
      const sb=document.getElementById('search'); if(sb){ sb.value=''; sb.placeholder='Matrice de acoperire pe capitole'; }
      return;
    }
    return _setModeOrig(m);
  };
}

async function aiApel(body){
  const r = await fetch(AI_FN_URL, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SB_KEY, Authorization:'Bearer '+SB_KEY }, body: JSON.stringify(body) });
  const j = await r.json().catch(()=>({error:'raspuns invalid'}));
  if(!r.ok || j.error){ if(r.status===401){ PIN=''; localStorage.removeItem('quadra_pin'); } throw new Error(j.error || ('HTTP '+r.status)); }
  return j;
}
async function aiCount(filtru){
  const r = await fetch(`${SB_URL}/viz_ai_prompturi?${filtru}&select=nod_id&limit=1`, { headers:{...HDRS, Prefer:'count=exact', Range:'0-0'} });
  return parseInt((r.headers.get('content-range')||'/0').split('/')[1]||'0',10)||0;
}

// ---- Indicator fix (persista cat ruleaza, oriunde ai naviga) ----
function aiPill(){
  let el=document.getElementById('ai-pill');
  if(!AI.running){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='ai-pill';
    el.style.cssText='position:fixed;bottom:16px;left:16px;z-index:80;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;font-size:12.5px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:min(560px,92vw)';
    document.body.appendChild(el); }
  const t=AI.total||0, f=AI.facut||0, pct=t?Math.round(100*f/t):0;
  el.innerHTML = `<span>&#10024; <b>AI lucreaza in fundal</b> &middot; ${f}${t?`/${t}`:''} (${pct}%)${AI.ramase!=null?` &middot; ramase ${AI.ramase}`:''}${AI.erori?` &middot; <span style="color:#f87171">erori ${AI.erori}</span>`:''}${AI.ultima?` &middot; <span style="color:var(--muted)">${esc(AI.ultima)}</span>`:''}</span><button class="btn mini" id="ai-pill-stop">opreste</button>`;
  el.querySelector('#ai-pill-stop').onclick=()=>{ AI.stop=true; el.querySelector('#ai-pill-stop').textContent='se opreste...'; };
}

// ---- Runnerul (independent de modal) ----
async function aiStart(cfg){
  if(AI.running){ toast('Deja ruleaza. Poti inchide fereastra si te poti plimba.', false); return; }
  Object.assign(AI, { running:true, stop:false, cfg, facut:0, total:null, ramase:null, erori:0, ultima:'' });
  aiPill(); aiSyncModal();
  let eroriConsec=0;
  try{
    while(!AI.stop){
      const r = await aiApel({ pin:PIN, tip:cfg.tip, scope:cfg.scope, nod_id:cfg.nodId||'', model:cfg.model, batch:1, doar_neprocesate:cfg.skip });
      AI.total=r.total_scope; AI.facut=r.facute; AI.ramase=r.ramase; AI.erori=r.erori;
      for(const p of (r.procesate||[])){
        AI.ultima=p.denumire;
        if(p.ok){ eroriConsec=0; aiLog(`OK  ${p.nod_id}  ${p.denumire}`+(p.sinonime_adaugate?`  (+${p.sinonime_adaugate} sinonime)`:'')); }
        else { eroriConsec++; aiLog(`ERR ${p.nod_id}  ${p.eroare}`, true); }
      }
      aiPill(); aiSyncModal();
      if(r.ramase<=0){ aiLog('GATA - domeniul este complet oficializat.'); break; }
      if(!r.procesate||!r.procesate.length){ aiLog('Nimic de procesat in domeniul ales.'); break; }
      if(eroriConsec>=3){ aiLog('Oprit automat dupa 3 erori consecutive - vezi/reia erorile.', true); break; }
    }
  }catch(err){ aiLog('Eroare: '+err.message, true); toast(err.message, true); }
  AI.running=false; aiPill(); aiSyncModal();
  if(MODE==='matrice'){ const np=document.getElementById('nom-pane'); if(np) renderMatricePane(np); }
  if(typeof currentId!=='undefined' && currentId && typeof showDetail==='function') showDetail(currentId);
}
function aiSyncModal(){
  const st=document.getElementById('ai-status'), bar=document.getElementById('ai-bar'), start=document.getElementById('ai-start'), stop=document.getElementById('ai-stop');
  if(!st) return;
  const t=AI.total||0, f=AI.facut||0;
  bar && (bar.style.width = t?Math.round(100*f/t)+'%':'0%');
  if(AI.running){ st.textContent=`ruleaza in fundal: oficializate ${f}${t?` / ${t}`:''}, erori ${AI.erori}, ramase ${AI.ramase} - poti inchide fereastra`; start&&(start.disabled=true); stop&&(stop.disabled=false); }
  else { st.innerHTML='&nbsp;'; start&&(start.disabled=false); stop&&(stop.disabled=true); }
}

function aiModal(){
  if(!PIN){ try{ localStorage.setItem('quadra_pin','x'); }catch(e){} PIN='x'; }
  const nodSel = (typeof currentId!=='undefined' && currentId) ? (nodeCache[currentId]?.denumire || currentId) : null;
  const m = showModal('&#10024; Prompturi oficiale cu AI (Claude)', `
    <div class="hint">Apesi <b>porneste</b> si AI-ul lucreaza in <b>fundal</b>: poti inchide fereastra si te poti plimba prin platforma; el continua (indicatorul din stanga-jos are progres si buton de oprire). Se reia oricand de unde a ramas. Merge de sus in jos, SI pe categorii SI pe leafuri; fiecare nod primeste ca context TOATA structura superioara. O eroare pe un nod NU blocheaza restul - o reiei separat (optiunea "doar erorile").</div>
    <label>Ce prompt imbunatatim</label>
    <select id="ai-tip">${AI_TIPURI.map(t=>`<option value="${t.id}" ${t.activ?'':'disabled'}>${t.nume}${t.activ?'':' (regulile urmeaza)'}</option>`).join('')}</select>
    <label>Domeniu de lucru</label>
    <div style="margin:4px 0 10px; display:flex; flex-direction:column; gap:6px; font-size:13px;">
      <label style="display:flex;gap:8px;align-items:center;"><input type="radio" name="ai-scope" value="nod" ${nodSel?'checked':''} ${nodSel?'':'disabled'}> nodul selectat${nodSel?': <b style="color:var(--accent)">'+esc(nodSel)+'</b>':' <span class="hint">(selecteaza intai un nod)</span>'}</label>
      <label style="display:flex;gap:8px;align-items:center;"><input type="radio" name="ai-scope" value="ramura" ${nodSel?'':'disabled'}> nodul selectat + descendentii (ramura)</label>
      <label style="display:flex;gap:8px;align-items:center;"><input type="radio" name="ai-scope" value="tot" ${nodSel?'':'checked'}> toata taxonomia (17.225 noduri)</label>
      <label style="display:flex;gap:8px;align-items:center;color:#fbbf24"><input type="radio" name="ai-scope" value="erori"> doar erorile - reincearca (<span id="ai-nrerori">?</span>)</label>
    </div>
    <label style="display:flex;gap:8px;align-items:center;font-size:13px;text-transform:none;letter-spacing:0;color:var(--text);"><input type="checkbox" id="ai-skip" checked> sar peste nodurile deja atinse (continua de unde a ramas)</label>
    <label style="margin-top:10px;display:block;">Model Claude</label>
    <select id="ai-model">${AI_MODELE.map(x=>`<option value="${x.id}">${x.nume} &middot; ${x.cost}</option>`).join('')}</select>
    <div id="ai-evidenta" style="margin-top:8px;font-size:12.5px;color:var(--muted)">se incarca evidenta...</div>
    <div id="ai-status" style="margin-top:8px;font-size:12.5px;color:var(--muted)">&nbsp;</div>
    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;height:10px;overflow:hidden;margin:6px 0 10px;"><div id="ai-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#0ea5e9,#34d399);transition:width .3s;"></div></div>
    <div id="ai-log" style="max-height:150px;overflow-y:auto;font-size:12px;line-height:1.6;font-family:ui-monospace,Menlo,monospace;"></div>
  `, `<button class="btn" id="ai-stop" disabled>opreste</button><button class="btn primary" id="ai-start">porneste</button>`);
  const elEv=m.querySelector('#ai-evidenta'), elTip=m.querySelector('#ai-tip'), elLog=m.querySelector('#ai-log');
  AI_LOGS.slice().reverse().forEach(x=>{ const d=document.createElement('div'); if(x.err)d.style.color='#f87171'; d.textContent=x.t; elLog.prepend(d); });
  async function ev(){ try{
    const [ok,er]=await Promise.all([aiCount(`tip=eq.${elTip.value}&status=eq.ok`), aiCount(`tip=eq.${elTip.value}&status=eq.eroare`)]);
    elEv.innerHTML=`Evidenta (tip: <b>${esc(elTip.value)}</b>): <span style="color:var(--green)">&#10004; oficializate ${ok}</span> &middot; <span style="color:#f87171">&#10008; erori ${er}</span> &middot; ramase ${Math.max(0,17225-ok-er)}`;
    const ne=document.getElementById('ai-nrerori'); if(ne) ne.textContent=er;
  }catch(e){ elEv.textContent='evidenta indisponibila'; } }
  ev(); elTip.onchange=ev; aiSyncModal();
  m.querySelector('#ai-start').onclick=()=>{
    const scope=(m.querySelector('input[name=ai-scope]:checked')||{}).value||'tot';
    if((scope==='nod'||scope==='ramura') && !currentId){ toast('Selecteaza intai un nod.', true); return; }
    if(scope==='tot' && !confirm('Pornesc pe TOATA taxonomia? Lucreaza in fundal; poti opri din indicatorul din stanga-jos.')) return;
    aiStart({ tip:elTip.value, scope, nodId: currentId||'', model:m.querySelector('#ai-model').value, skip:m.querySelector('#ai-skip').checked });
  };
  m.querySelector('#ai-stop').onclick=()=>{ AI.stop=true; };
}

    const th='padding:7px 9px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg)';
    const td='padding:7px 9px;border-bottom:1px solid #1c2942;font-size:12.5px;vertical-align:middle';
    let h=`<table style="border-collapse:collapse;width:100%;min-width:820px"><thead><tr>

    rows.forEach((r,i)=>{

        <td style="${td}">${r.are_copii?'<span style="color:var(--muted)">&#9656;</span> ':'<span style="opacity:.3">&#8226;</span> '}<span class="node-id" style="font-size:10px">${esc(r.nod_id)}</span> <b>${esc(r.denumire)}</b> <span style="font-size:10px;color:var(--muted)">${esc(r.tip)}</span></td>
        <td style="${td};min-width:150px">${mxBar(r.desc_completate, r.noduri_total)}</td>
        <td style="${td};min-width:150px">${mxBar(r.ai_imbunatatite, r.noduri_total)}</td>
        <td style="${td};text-align:right">${r.ai_erori?`<span style="color:#f87171">${r.ai_erori}</span>`:'0'}</td>
        <td style="${td};text-align:right">${r.leafuri_total}</td>
        <td style="${td};text-align:right;color:var(--p-col)">${r.nr_p}</td>
        <td style="${td};text-align:right;color:var(--green)">${r.nr_prm}</td></tr>`;
    });
    h+=`<tr style="border-top:2px solid var(--border);font-weight:600">
      <td style="${td}">TOTAL (${rows.length} capitole)</td><td style="${td}">${mxBar(tot.d,tot.n)}</td><td style="${td}">${mxBar(tot.ai,tot.n)}</td>
